spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: org.h2.Driver
    username: ${TEST_DB_USER:sa}
    password: ${TEST_DB_PASSWORD:}
    hikari:
      pool-name: HostelTestHikariPool
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:testFallbackJwtSecretMustBeAtLeast256BitsForSigningJwts2026!}
    expiration-ms: 86400000
    cookie-name: hostel_jwt
  upload:
    dir: ./target/test-storage/photos
  timezone: Asia/Kolkata
  db-timezone: UTC
