server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: false # set true in HTTPS production
        same-site: strict

spring:
  application:
    name: smart-hostel-management

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hostel_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${DB_TIMEZONE:UTC}&characterEncoding=UTF-8}
    username: ${DB_USER:${DB_USERNAME:root}}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HostelSharedHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: ${DB_TIMEZONE:UTC}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB

app:
  admin:
    seed:
      username: ${ADMIN_USERNAME:1234567890}
      password: ${ADMIN_PASSWORD:1234567890}
  security:
    force-password-change-on-first-login: ${FORCE_PASSWORD_CHANGE_ON_FIRST_LOGIN:true}
  room-seed:
    hostel-code: PSG_ITECH
    hostel-name: "PSG iTech Hostel"
    hostel-address: "PSG iTech Campus, Neelambur, Coimbatore"
    start-room-number: 101
    end-room-number: 200
    capacity-per-room: 4
    rooms-per-floor: 25
    total-bed-capacity: 400
    bed-labels:
      - A
      - B
      - C
      - D
  jwt:
    secret: ${JWT_SECRET:devFallbackJwtSecretMustBeChangedInProductionEnvironment2026!}
    expiration-ms: 86400000 # 24 hours
    cookie-name: hostel_jwt
  upload:
    dir: ${UPLOAD_DIR:./storage/photos}
  timezone: ${APP_DISPLAY_TIMEZONE:Asia/Kolkata}
  db-timezone: ${DB_TIMEZONE:UTC}
