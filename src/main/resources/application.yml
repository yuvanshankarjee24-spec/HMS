server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: false # set true in HTTPS production
        same-site: strict

spring:
  application:
    name: smart-hostel-management

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hostel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

app:
  jwt:
    secret: ${JWT_SECRET:smartHostelManagementSecretKeyForSigningJwtsMustBeLongEnoughAtLeast256Bits2026!}
    expiration-ms: 86400000 # 24 hours
    cookie-name: hostel_jwt
  upload:
    dir: ${UPLOAD_DIR:./storage/photos}
  timezone: Asia/Kolkata
