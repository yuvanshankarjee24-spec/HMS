<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Smart Hostel</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    body {
      background: var(--page-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .pw-card {
      background: #ffffff;
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-floating);
      border: 1px solid var(--border-light);
    }

    .pw-header {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .pw-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-subtle);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }

    .pw-heading {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.35rem;
    }

    .pw-subheading {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .pw-rules {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.825rem;
      color: var(--text-muted);
    }

    .pw-rules ul {
      margin-left: 1.25rem;
      margin-top: 0.35rem;
    }
  </style>
</head>

<body>

  <div class="pw-card">
    <div class="pw-header">
      <div class="pw-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <h1 class="pw-heading">Change Password</h1>
      <p class="pw-subheading">Update your password to secure your hostel account</p>
    </div>

    <div class="pw-rules">
      <strong>Password Requirements:</strong>
      <ul>
        <li>At least 8 characters long</li>
        <li>Must contain at least one letter and one number</li>
      </ul>
    </div>

    <form id="changePasswordForm">
      <div class="form-group">
        <label class="form-label" for="oldPasswordInput">Current Password</label>
        <input type="password" id="oldPasswordInput" class="form-control" required placeholder="Enter current password">
      </div>

      <div class="form-group">
        <label class="form-label" for="newPasswordInput">New Password</label>
        <input type="password" id="newPasswordInput" class="form-control" required minlength="8"
          placeholder="Enter new strong password">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPasswordInput">Confirm New Password</label>
        <input type="password" id="confirmPasswordInput" class="form-control" required minlength="8"
          placeholder="Re-enter new password">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Update Password
      </button>

      <button type="button" id="cancelBtn" class="btn btn-secondary" style="width: 100%; margin-top: 0.75rem;">
        Back to Dashboard
      </button>
    </form>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/ui.js?v=4"></script>
  <script>
    let currentUser = null;

    (async () => {
      currentUser = await Auth.requireAuth();
      if (!currentUser) return;
      if (currentUser.role === 'STUDENT' && !currentUser.mustChangePassword) {
        window.location.replace('/student/profile.html?tab=password');
        return;
      }

      // If user doesn't need to change password and wants to go back
      document.getElementById('cancelBtn').addEventListener('click', () => {
        Auth.redirectToDashboard(currentUser.role);
      });
    })();

    const form = document.getElementById('changePasswordForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const oldPassword = document.getElementById('oldPasswordInput').value;
      const newPassword = document.getElementById('newPasswordInput').value;
      const confirmPassword = document.getElementById('confirmPasswordInput').value;

      if (newPassword !== confirmPassword) {
        UI.showToast('New passwords do not match', 'error');
        return;
      }

      if (newPassword.length < 8 || !/[a-zA-Z]/.test(newPassword) || !/\d/.test(newPassword)) {
        UI.showToast('Password must be at least 8 characters with both letters and numbers', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ oldPassword, newPassword })
        });

        if (!res.ok) {
          const data = await res.json();
          UI.showToast(data.message || 'Failed to update password', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
          return;
        }

        UI.showToast('Password updated successfully! Redirecting...', 'success');
        setTimeout(() => {
          Auth.redirectToDashboard(currentUser.role);
        }, 1200);

      } catch (err) {
        UI.showToast('Network error while changing password', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });
  </script>
</body>

</html>
