<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room & Bed Management - Smart Hostel</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .room-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.5rem;
    }

    .room-card-box {
      background: #fff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .room-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 0.75rem;
    }

    .room-title-h3 {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .beds-container {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .bed-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      background: var(--input-bg);
      border: 1px solid var(--border-subtle);
      font-size: 0.875rem;
    }

    .bed-item.occupied {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .bed-item.available {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div id="app-layout" class="app-container">
    <main class="main-content">
      <div class="page-body">

        <div class="card-header" style="margin-bottom: 2rem;">
          <div>
            <h1 style="font-size: 1.75rem;">Room & Bed Directory</h1>
            <p style="color: var(--text-muted);">Manage room allocations, floor capacities, and inspect bed assignments.</p>
          </div>
          <div style="display: flex; gap: 0.75rem;">
            <a href="/warden/dashboard.html" class="btn btn-secondary btn-sm">Warden Overview</a>
            <button class="btn btn-primary btn-sm" onclick="UI.openModal('addRoomModal')">+ Add New Room</button>
          </div>
        </div>

        <div class="room-cards-grid" id="roomCardsGrid">
          <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem;">
            Loading rooms and bed allocations...
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Add Room Modal -->
  <div class="modal-overlay" id="addRoomModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Create New Room</h3>
        <button class="modal-close" onclick="UI.closeModal('addRoomModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="addRoomForm">
          <div class="form-group">
            <label class="form-label" for="addRoomNumber">Room Number *</label>
            <input type="text" id="addRoomNumber" class="form-control" required placeholder="e.g. 201">
          </div>
          <div class="form-group">
            <label class="form-label" for="addFloor">Floor Number *</label>
            <input type="number" id="addFloor" class="form-control" min="1" max="20" required value="1">
          </div>
          <div class="form-group">
            <label class="form-label" for="addCapacity">Capacity (Number of Beds) *</label>
            <input type="number" id="addCapacity" class="form-control" min="1" max="10" required value="4">
            <small style="color: var(--text-muted); font-size: 0.8rem;">Matching beds (1 to Capacity) will be automatically created.</small>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="UI.closeModal('addRoomModal')">Cancel</button>
        <button class="btn btn-primary" id="btnSubmitAddRoom">Create Room</button>
      </div>
    </div>
  </div>

  <!-- Edit Room Capacity Modal -->
  <div class="modal-overlay" id="editRoomModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="editModalTitle">Edit Room Capacity</h3>
        <button class="modal-close" onclick="UI.closeModal('editRoomModal')">&times;</button>
      </div>
      <div class="modal-body">
        <p id="editRoomNotice" style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1rem;"></p>
        <div class="form-group">
          <label class="form-label" for="editCapacityInput">New Bed Capacity *</label>
          <input type="number" id="editCapacityInput" class="form-control" min="1" max="10" required>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="UI.closeModal('editRoomModal')">Cancel</button>
        <button class="btn btn-primary" id="btnSubmitEditRoom">Update Capacity</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/ui.js?v=3"></script>
  <script>
    let activeEditRoom = null;

    async function loadRoomsWithBeds() {
      try {
        const res = await fetch('/api/warden/rooms');
        if (!res.ok) throw new Error('Failed to load rooms');
        const rooms = await res.json();
        renderRooms(rooms);
      } catch (err) {
        UI.showToast(err.message, 'error');
      }
    }

    function renderRooms(rooms) {
      const grid = document.getElementById('roomCardsGrid');
      grid.innerHTML = '';

      if (rooms.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem;">No rooms added yet.</div>';
        return;
      }

      rooms.forEach(r => {
        const box = document.createElement('div');
        box.className = 'room-card-box';

        // Header
        const top = document.createElement('div');
        top.className = 'room-card-top';

        const titleDiv = document.createElement('div');
        const h3 = document.createElement('h3');
        h3.className = 'room-title-h3';
        h3.textContent = `Room ${r.roomNumber}`;
        const sub = document.createElement('p');
        sub.style.fontSize = '0.825rem';
        sub.style.color = 'var(--text-muted)';
        sub.textContent = `Floor ${r.floor} • Capacity: ${r.capacity} beds (${r.occupied} occupied, ${r.available} free)`;
        titleDiv.append(h3, sub);

        const btnEdit = document.createElement('button');
        btnEdit.className = 'btn btn-secondary btn-sm';
        btnEdit.textContent = 'Edit Capacity';
        btnEdit.onclick = () => openEditModal(r);

        top.append(titleDiv, btnEdit);

        // Beds list
        const bedsList = document.createElement('div');
        bedsList.className = 'beds-container';

        r.beds.forEach(b => {
          const bedItem = document.createElement('div');
          bedItem.className = `bed-item ${b.studentName ? 'occupied' : 'available'}`;

          const bedLeft = document.createElement('div');
          bedLeft.style.fontWeight = '600';
          bedLeft.textContent = `Bed #${b.bedNumber}`;

          const bedRight = document.createElement('div');
          bedRight.style.textAlign = 'right';

          if (b.studentName) {
            const nameSpan = document.createElement('span');
            nameSpan.style.color = '#15803d';
            nameSpan.style.fontWeight = '700';
            nameSpan.textContent = b.studentName;

            const regSpan = document.createElement('div');
            regSpan.style.fontSize = '0.75rem';
            regSpan.style.color = 'var(--text-muted)';
            regSpan.textContent = `${b.registerNumber} (${b.department || ''})`;

            bedRight.append(nameSpan, regSpan);
          } else {
            const availSpan = document.createElement('span');
            availSpan.style.color = '#64748b';
            availSpan.textContent = '— Available —';
            bedRight.appendChild(availSpan);
          }

          bedItem.append(bedLeft, bedRight);
          bedsList.appendChild(bedItem);
        });

        box.append(top, bedsList);
        grid.appendChild(box);
      });
    }

    // Add room
    document.getElementById('btnSubmitAddRoom').addEventListener('click', async () => {
      const roomNumber = document.getElementById('addRoomNumber').value.trim();
      const floor = parseInt(document.getElementById('addFloor').value);
      const capacity = parseInt(document.getElementById('addCapacity').value);

      if (!roomNumber || !floor || !capacity) {
        UI.showToast('Please fill all required room fields', 'error');
        return;
      }

      try {
        const res = await fetch('/api/warden/rooms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roomNumber, floor, capacity })
        });
        const data = await res.json();
        if (!res.ok) {
          UI.showToast(data.message || 'Failed to add room', 'error');
          return;
        }

        UI.showToast(`Room ${roomNumber} created with ${capacity} beds!`, 'success');
        UI.closeModal('addRoomModal');
        document.getElementById('addRoomForm').reset();
        loadRoomsWithBeds();
      } catch (err) {
        UI.showToast('Network error adding room', 'error');
      }
    });

    // Edit room modal
    function openEditModal(room) {
      activeEditRoom = room;
      document.getElementById('editModalTitle').textContent = `Edit Capacity: Room ${room.roomNumber}`;
      document.getElementById('editRoomNotice').textContent = 
        `Currently ${room.occupied} bed(s) are occupied. Capacity cannot be reduced below ${room.occupied}.`;
      document.getElementById('editCapacityInput').value = room.capacity;
      document.getElementById('editCapacityInput').min = room.occupied;
      UI.openModal('editRoomModal');
    }

    document.getElementById('btnSubmitEditRoom').addEventListener('click', async () => {
      const capacity = parseInt(document.getElementById('editCapacityInput').value);
      if (!capacity || capacity < activeEditRoom.occupied) {
        UI.showToast(`Capacity cannot be lower than ${activeEditRoom.occupied} occupied beds`, 'error');
        return;
      }

      try {
        const res = await fetch(`/api/warden/rooms/${activeEditRoom.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ capacity })
        });
        const data = await res.json();
        if (!res.ok) {
          UI.showToast(data.message || 'Failed to update capacity', 'error');
          return;
        }

        UI.showToast(`Room ${activeEditRoom.roomNumber} capacity updated to ${capacity}!`, 'success');
        UI.closeModal('editRoomModal');
        loadRoomsWithBeds();
      } catch (err) {
        UI.showToast('Network error updating capacity', 'error');
      }
    });

    (async () => {
      const user = await Auth.requireAuth(['WARDEN', 'ADMIN']);
      if (!user) return;
      UI.renderLayout(user, 'rooms');
      loadRoomsWithBeds();
    })();
  </script>
</body>
</html>
