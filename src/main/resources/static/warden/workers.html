<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Workers - PSG iTech Hostel</title>
  <link rel="icon" type="image/png" href="/img/psgitech_logo.png">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>
  <div id="app-layout" class="app-container">
    <main class="main-content">
      <div class="page-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Maintenance Workers Directory</h1>
            <p class="page-subtitle">Create, edit, activate, or deactivate hostel maintenance workers by skill category.</p>
          </div>
          <div>
            <button type="button" class="btn btn-primary btn-sm" id="btnAddWorker">+ Add Worker</button>
          </div>
        </div>

        <div class="card" style="padding: 1.25rem; margin-bottom: 1.25rem;">
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: end;">
            <div style="flex: 1; min-width: 220px;">
              <label class="form-label">Search</label>
              <input type="text" id="filterQuery" class="form-control" placeholder="Name, Employee ID, or Phone...">
            </div>
            <div>
              <label class="form-label">Skill / Worker Type</label>
              <select id="filterType" class="form-control" style="width: 190px;">
                <option value="">All Skills</option>
                <option value="CLEANING">Cleaner / Housekeeping</option>
                <option value="ELECTRICAL">Electrician</option>
                <option value="PLUMBING">Plumber</option>
                <option value="CARPENTRY">Carpenter</option>
                <option value="IT_NETWORK">IT / WiFi Support</option>
                <option value="GENERAL">General Maintenance</option>
              </select>
            </div>
            <div>
              <label class="form-label">Status</label>
              <select id="filterActive" class="form-control" style="width: 140px;">
                <option value="">All</option>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
              </select>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" id="btnSearch">Search</button>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="data-table mobile-collapse-table">
              <thead>
                <tr>
                  <th>Employee ID</th>
                  <th>Name &amp; Email</th>
                  <th>Phone</th>
                  <th>Skill Type</th>
                  <th>Completed</th>
                  <th>Avg Rating</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="workersBody">
                <tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">Loading workers...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create / Edit Worker Modal -->
  <div class="modal-overlay" id="workerModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="workerModalTitle">Add Maintenance Worker</h3>
        <button class="modal-close" onclick="UI.closeModal('workerModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="workerForm">
          <input type="hidden" id="editWorkerId">
          <div class="form-group">
            <label class="form-label" for="wName">Full Name *</label>
            <input type="text" id="wName" class="form-control" required placeholder="e.g. Karthik Rajan">
          </div>
          <div class="form-group" id="emailGroup">
            <label class="form-label" for="wEmail">Login Email *</label>
            <input type="email" id="wEmail" class="form-control" required placeholder="e.g. electrician2@hostel.edu">
          </div>
          <div class="form-group">
            <label class="form-label" for="wEmpId">Employee ID *</label>
            <input type="text" id="wEmpId" class="form-control" required placeholder="e.g. WRK-1007">
          </div>
          <div class="form-group">
            <label class="form-label" for="wPhone">Phone Number *</label>
            <input type="text" id="wPhone" class="form-control" required placeholder="e.g. +91 9840112233">
          </div>
          <div class="form-group">
            <label class="form-label" for="wType">Worker Type / Skill *</label>
            <select id="wType" class="form-control" required>
              <option value="CLEANING">Cleaner / Housekeeping</option>
              <option value="ELECTRICAL">Electrician</option>
              <option value="PLUMBING">Plumber</option>
              <option value="CARPENTRY">Carpenter</option>
              <option value="IT_NETWORK">IT / WiFi Support</option>
              <option value="GENERAL">General Maintenance</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="wPassword" id="wPasswordLabel">Password *</label>
            <input type="password" id="wPassword" class="form-control" minlength="6" placeholder="Min 6 characters">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="UI.closeModal('workerModal')">Cancel</button>
        <button class="btn btn-primary" id="btnSaveWorker">Save Worker</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/ui.js?v=3"></script>
  <script>
    (async () => {
      const user = await Auth.requireAuth(['WARDEN', 'ADMIN']);
      if (!user) return;
      UI.renderLayout(user, 'workers');

      async function loadWorkers() {
        const params = new URLSearchParams();
        const q = document.getElementById('filterQuery').value.trim();
        const t = document.getElementById('filterType').value;
        const a = document.getElementById('filterActive').value;
        if (q) params.append('query', q);
        if (t) params.append('workerType', t);
        if (a !== '') params.append('active', a);

        const res = await fetch(`/api/warden/workers?${params.toString()}`, { credentials: 'same-origin' });
        const tbody = document.getElementById('workersBody');
        tbody.innerHTML = '';
        if (!res.ok) return;
        const list = await res.json();
        if (list.length === 0) {
          tbody.appendChild(UI.createElement('tr', {}, UI.createElement('td', { colSpan: 8, style: 'text-align:center;padding:2rem;color:var(--text-muted);' }, 'No workers found.')));
          return;
        }
        list.forEach(w => {
          const toggleBtn = UI.createElement('button', {
            className: w.active ? 'btn btn-danger btn-sm' : 'btn btn-success btn-sm',
            onclick: () => toggleActive(w.id, !w.active, w.fullName)
          }, w.active ? 'Deactivate' : 'Activate');

          const editBtn = UI.createElement('button', {
            className: 'btn btn-secondary btn-sm',
            onclick: () => openEditModal(w)
          }, 'Edit');

          const tr = UI.createElement('tr', {},
            UI.createElement('td', { dataset: { label: 'Emp ID' } }, UI.createElement('strong', {}, w.employeeId)),
            UI.createElement('td', { dataset: { label: 'Worker' } },
              UI.createElement('div', { style: 'font-weight:600;' }, w.fullName),
              UI.createElement('div', { style: 'font-size:0.78rem;color:var(--text-muted);' }, w.email)
            ),
            UI.createElement('td', { dataset: { label: 'Phone' } }, w.phone),
            UI.createElement('td', { dataset: { label: 'Skill' } }, UI.workerSkillLabel(w.workerType)),
            UI.createElement('td', { dataset: { label: 'Completed' } }, String(w.tasksCompleted || 0)),
            UI.createElement('td', { dataset: { label: 'Rating' } }, w.averageRating ? `${w.averageRating} / 5` : 'N/A'),
            UI.createElement('td', { dataset: { label: 'Status' } },
              UI.createElement('span', { className: `status-badge ${w.active ? 'badge-active' : 'badge-absent'}` }, w.active ? 'Active' : 'Inactive')
            ),
            UI.createElement('td', { dataset: { label: 'Actions' } },
              UI.createElement('div', { style: 'display:flex;gap:0.4rem;flex-wrap:wrap;' }, editBtn, toggleBtn)
            )
          );
          tbody.appendChild(tr);
        });
      }

      document.getElementById('btnAddWorker').addEventListener('click', () => {
        document.getElementById('editWorkerId').value = '';
        document.getElementById('workerModalTitle').textContent = 'Add Maintenance Worker';
        document.getElementById('workerForm').reset();
        document.getElementById('emailGroup').style.display = 'flex';
        document.getElementById('wEmail').required = true;
        document.getElementById('wPassword').required = true;
        document.getElementById('wPasswordLabel').textContent = 'Password *';
        UI.openModal('workerModal');
      });

      function openEditModal(w) {
        document.getElementById('editWorkerId').value = w.id;
        document.getElementById('workerModalTitle').textContent = `Edit Worker — ${w.fullName}`;
        document.getElementById('wName').value = w.fullName;
        document.getElementById('wEmpId').value = w.employeeId;
        document.getElementById('wPhone').value = w.phone;
        document.getElementById('wType').value = w.workerType;
        document.getElementById('wPassword').value = '';
        document.getElementById('wPassword').required = false;
        document.getElementById('wPasswordLabel').textContent = 'Reset Password (Optional)';
        document.getElementById('emailGroup').style.display = 'none';
        document.getElementById('wEmail').required = false;
        UI.openModal('workerModal');
      }

      document.getElementById('btnSaveWorker').addEventListener('click', async () => {
        const editId = document.getElementById('editWorkerId').value;
        const fullName = document.getElementById('wName').value.trim();
        const employeeId = document.getElementById('wEmpId').value.trim();
        const phone = document.getElementById('wPhone').value.trim();
        const workerType = document.getElementById('wType').value;
        const password = document.getElementById('wPassword').value;

        if (!fullName || !employeeId || !phone) {
          UI.showToast('Please fill all required fields', 'error');
          return;
        }

        let res;
        if (!editId) {
          const email = document.getElementById('wEmail').value.trim();
          if (!email || !password || password.length < 6) {
            UI.showToast('Email and password (min 6 chars) are required', 'error');
            return;
          }
          res = await fetch('/api/warden/workers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ fullName, email, phone, workerType, employeeId, password })
          });
        } else {
          res = await fetch(`/api/warden/workers/${editId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ fullName, phone, workerType, employeeId, newPassword: password || null })
          });
        }

        const data = await res.json();
        if (!res.ok) {
          UI.showToast(data.message || 'Failed to save worker', 'error');
        } else {
          UI.closeModal('workerModal');
          UI.showToast(editId ? 'Worker updated!' : 'Worker created!', 'success');
          await loadWorkers();
        }
      });

      async function toggleActive(id, active, name) {
        const ok = await UI.showConfirm({
          title: active ? 'Activate Worker' : 'Deactivate Worker',
          message: `Are you sure you want to ${active ? 'activate' : 'deactivate'} ${name}?`,
          confirmText: active ? 'Activate' : 'Deactivate'
        });
        if (!ok) return;
        const res = await fetch(`/api/warden/workers/${id}/active?active=${active}`, {
          method: 'PATCH',
          credentials: 'same-origin'
        });
        if (res.ok) {
          UI.showToast(`Worker ${active ? 'activated' : 'deactivated'}.`, 'success');
          await loadWorkers();
        }
      }

      document.getElementById('btnSearch').addEventListener('click', loadWorkers);
      await loadWorkers();
    })();
  </script>
</body>
</html>
