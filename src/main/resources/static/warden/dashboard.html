<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warden Dashboard - PSG iTech Hostel</title>
  <link rel="icon" type="image/png" href="/img/psgitech_logo.png">
  <link rel="stylesheet" href="/css/common.css?v=6">
</head>
<body>
  <div id="app-layout" class="app-container">
    <main class="main-content">
      <div class="page-body">
        <!-- Page Header (matches Hostel Parcel Desk design) -->
        <div class="page-header">
          <div>
            <h1 class="page-title">Warden Dashboard</h1>
            <p class="page-subtitle" id="wardenScopeSubtitle">Monitor hostel outpasses, attendance locks, parcels, mess tokens, maintenance, and circulars.</p>
          </div>
          <div style="display:flex;gap:0.6rem;flex-wrap:wrap;align-items:center;">
            <span class="status-badge badge-active" id="hostelScopePill">Loading scope...</span>
            <button type="button" class="btn btn-secondary btn-sm" id="btnRefreshDashboard">Refresh</button>
          </div>
        </div>

        <!-- SummaryCards Strip + Attendance Status Bar (exact SummaryCards component) -->
        <div id="wardenSummaryCards"></div>

        <!-- Pill-style URL-synced Tabs -->
        <div class="portal-tabs" id="wardenDashboardTabs">
          <button type="button" class="portal-tab-btn active" data-tab="overview">Overview</button>
          <button type="button" class="portal-tab-btn" data-tab="pending-actions">Pending Actions</button>
          <button type="button" class="portal-tab-btn" data-tab="recent-activity">Recent Activity</button>
        </div>

        <!-- TAB 1: OVERVIEW -->
        <section id="panel-overview" data-tab-panel="overview">
          <div id="overviewModuleCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem;"></div>
        </section>

        <!-- TAB 2: PENDING ACTIONS -->
        <section id="panel-pending-actions" data-tab-panel="pending-actions" style="display:none;">
          <div id="pendingActionsContainer" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1.25rem;"></div>
        </section>

        <!-- TAB 3: RECENT ACTIVITY -->
        <section id="panel-recent-activity" data-tab-panel="recent-activity" style="display:none;">
          <div class="card">
            <div class="card-header" style="flex-wrap:wrap;gap:0.75rem;">
              <h2 class="card-title">Recent Hostel Activity (Audit Log)</h2>
              <span class="type-helper">Times displayed in Asia/Kolkata (IST)</span>
            </div>
            <div class="table-responsive">
              <table class="data-table mobile-collapse-table">
                <thead>
                  <tr>
                    <th>Time (IST)</th>
                    <th>Module</th>
                    <th>Action</th>
                    <th>Actor</th>
                    <th>Target / Details</th>
                    <th>Result</th>
                  </tr>
                </thead>
                <tbody id="recentActivityBody">
                  <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-muted);">Loading recent activity...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/js/auth.js?v=5"></script>
  <script src="/js/ui.js?v=6"></script>
  <script>
    (async () => {
      const user = await Auth.requireAuth(['WARDEN', 'ADMIN']);
      if (!user) return;
      UI.renderLayout(user, user.role === 'ADMIN' ? 'warden-overview' : 'dashboard');

      UI.Tabs.init({
        barSelector: '#wardenDashboardTabs',
        paramName: 'tab',
        defaultTab: 'overview'
      });

      const summaryRoutes = {
        OUTPASS_PENDING: '/warden/outpasses.html?status=PENDING',
        OUTPASS_OUT: '/warden/outpasses.html?status=OUT',
        ATTENDANCE_MARKED: '/warden/attendance?tab=today',
        ATTENDANCE_LOCKED: '/warden/attendance?tab=missed',
        PARCELS_WAITING: '/warden/parcels.html?tab=register&status=NOTIFIED',
        MESS_TODAY: '/warden/mess.html?tab=tokens',
        MAINT_OPEN: '/warden/maintenance.html?tab=requests&status=OPEN',
        CIRCULAR_UNACK: '/warden/circulars.html?status=PUBLISHED'
      };

      async function loadDashboardOverview() {
        try {
          const res = await fetch('/api/warden/dashboard-overview', { credentials: 'same-origin' });
          if (!res.ok) {
            UI.showToast('Unable to load dashboard summary', 'error');
            return;
          }
          const data = await res.json();
          const s = data.summary || {};
          const pa = data.pendingActions || {};
          const activity = data.recentActivity || [];

          const scopePill = document.getElementById('hostelScopePill');
          if (scopePill) {
            scopePill.textContent = `Scope: ${s.hostelScopeLabel || 'All Campus Hostels'}`;
          }

          UI.SummaryCards.render('wardenSummaryCards', {
            onSelect: (key) => {
              const dest = summaryRoutes[key];
              if (dest) window.location.href = dest;
            },
            cards: [
              {
                key: 'OUTPASS_PENDING',
                label: 'Outpass Pending',
                value: s.outpassPending ?? 0,
                subtext: `Currently out: ${s.outpassCurrentlyOut ?? 0}`,
                accentColor: '#f59e0b',
                valColor: '#b45309'
              },
              {
                key: 'OUTPASS_OUT',
                label: 'Currently Out',
                value: s.outpassCurrentlyOut ?? 0,
                subtext: 'Students outside campus',
                accentColor: '#0284c7'
              },
              {
                key: 'ATTENDANCE_MARKED',
                label: 'Attendance Marked',
                value: s.attMarked ?? 0,
                subtext: `Missed: ${s.attMissed ?? 0} | Pending: ${s.attPending ?? 0}`,
                accentColor: '#16a34a',
                valColor: '#15803d'
              },
              {
                key: 'ATTENDANCE_LOCKED',
                label: 'Locked Outpasses',
                value: s.lockedOutpasses ?? 0,
                subtext: `Missed today: ${s.attMissed ?? 0}`,
                accentColor: '#dc2626',
                valColor: '#b91c1c'
              },
              {
                key: 'PARCELS_WAITING',
                label: 'Parcels Waiting',
                value: s.parcelsWaiting ?? 0,
                subtext: `COD pending: ${s.parcelsCodPending ?? 0}`,
                accentColor: '#d97706',
                valColor: '#b45309'
              },
              {
                key: 'MESS_TODAY',
                label: 'Mess Tokens Today',
                value: s.messTokensToday ?? 0,
                subtext: `Pending pickup: ${s.messTokensPending ?? 0}`,
                accentColor: '#0d9488',
                valColor: '#0f766e'
              },
              {
                key: 'MAINT_OPEN',
                label: 'Open Maintenance',
                value: s.maintOpen ?? 0,
                subtext: `Active workers: ${s.activeWorkers ?? 0}`,
                accentColor: '#6366f1',
                valColor: '#4338ca'
              },
              {
                key: 'CIRCULAR_UNACK',
                label: 'Unack Circulars',
                value: s.unacknowledgedCirculars ?? 0,
                subtext: 'Published notices needing ack',
                accentColor: '#e11d48',
                valColor: '#be123c'
              }
            ],
            chartTitle: "Today's Overall Attendance Status",
            chartSegments: [
              { label: 'Marked', value: s.attMarked ?? 0, color: '#16a34a' },
              { label: 'Pending', value: s.attPending ?? 0, color: '#f59e0b' },
              { label: 'Missed', value: s.attMissed ?? 0, color: '#dc2626' },
              { label: 'On Outpass', value: s.attOnOutpass ?? 0, color: '#7c3aed' }
            ]
          });

          renderOverviewModules(s);
          renderPendingActions(pa);
          renderRecentActivity(activity);
        } catch (err) {
          console.error('Warden dashboard load error:', err);
          UI.showToast('Failed to load dashboard overview', 'error');
        }
      }

      function renderOverviewModules(s) {
        const container = document.getElementById('overviewModuleCards');
        container.innerHTML = '';

        const modules = [
          {
            title: 'Outpass Requests',
            badge: `${s.outpassPending ?? 0} Pending`,
            badgeClass: (s.outpassPending || 0) > 0 ? 'badge-pending' : 'badge-active',
            desc: 'Review pending day passes and weekend leave applications, or view students currently outside campus.',
            href: '/warden/outpasses.html?status=PENDING',
            btnText: 'Open Outpass Desk'
          },
          {
            title: 'Digital Attendance & Roll Call',
            badge: `${s.lockedOutpasses ?? 0} Locked`,
            badgeClass: (s.lockedOutpasses || 0) > 0 ? 'badge-absent' : 'badge-present',
            desc: 'Monitor today’s attendance status, mark Roll Call Register per room, unlock outpasses, and export reports.',
            href: '/warden/attendance?tab=roll-call',
            btnText: 'Open Attendance'
          },
          {
            title: 'Parcel Desk & QR Delivery',
            badge: `${s.parcelsWaiting ?? 0} Waiting`,
            badgeClass: (s.parcelsWaiting || 0) > 0 ? 'badge-pending' : 'badge-active',
            desc: 'Scan student QR codes, log arrived courier packages, verify COD collection, and track long-pending items.',
            href: '/warden/parcels.html?tab=register&status=NOTIFIED',
            btnText: 'Open Parcels Desk'
          },
          {
            title: 'Mess Counter & Schedule',
            badge: `${s.messTokensPending ?? 0} Pending`,
            badgeClass: 'badge-active',
            desc: 'Verify booked mess meal QR tokens, monitor kitchen item quantities, and manage daily menus.',
            href: '/warden/mess.html?tab=tokens',
            btnText: 'Open Mess Desk'
          },
          {
            title: 'Maintenance & Workers',
            badge: `${s.maintOpen ?? 0} Open`,
            badgeClass: (s.maintOpen || 0) > 0 ? 'badge-late' : 'badge-active',
            desc: `Assign tickets to ${s.activeWorkers ?? 0} active technicians and monitor room repair progress.`,
            href: '/warden/maintenance.html?tab=requests&status=OPEN',
            btnText: 'Open Maintenance'
          },
          {
            title: 'Circulars & Events',
            badge: `${s.unacknowledgedCirculars ?? 0} Active`,
            badgeClass: 'badge-active',
            desc: 'Publish hostel notices, track student reads & mandatory acknowledgements, and manage event RSVPs.',
            href: '/warden/circulars.html?status=PUBLISHED',
            btnText: 'Open Circulars'
          },
          {
            title: 'Students Directory',
            badge: `${s.totalStudents ?? 0} Active`,
            badgeClass: 'badge-active',
            desc: 'Browse resident students, room allocations, and outpass eligibility across your hostel.',
            href: '/warden/students.html',
            btnText: 'Open Students'
          }
        ];

        modules.forEach(m => {
          const card = UI.createElement('div', {
            className: 'card',
            style: 'margin:0;display:flex;flex-direction:column;justify-content:space-between;'
          },
            UI.createElement('div', {},
              UI.createElement('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:0.5rem;margin-bottom:0.65rem;' },
                UI.createElement('h3', { className: 'type-h3' }, m.title),
                UI.createElement('span', { className: `status-badge ${m.badgeClass}` }, m.badge)
              ),
              UI.createElement('p', { className: 'type-secondary', style: 'margin-bottom:1rem;' }, m.desc)
            ),
            UI.createElement('a', { href: m.href, className: 'btn btn-primary btn-sm', style: 'justify-content:center;' }, m.btnText)
          );
          container.appendChild(card);
        });
      }

      function renderActionSectionCard(title, badgeText, badgeClass, actionHref, actionLabel, rows, renderRow) {
        const card = UI.createElement('div', { className: 'card', style: 'margin:0;' });
        card.appendChild(
          UI.createElement('div', { className: 'card-header', style: 'flex-wrap:wrap;gap:0.5rem;' },
            UI.createElement('div', { style: 'display:flex;align-items:center;gap:0.5rem;' },
              UI.createElement('h3', { className: 'card-title' }, title),
              UI.createElement('span', { className: `status-badge ${badgeClass}` }, badgeText)
            ),
            UI.createElement('a', { href: actionHref, className: 'btn btn-secondary btn-sm' }, actionLabel)
          )
        );

        if (!rows || rows.length === 0) {
          card.appendChild(
            UI.createElement('div', { style: 'padding:1.25rem 0;text-align:center;color:var(--text-muted);font-size:var(--font-size-secondary);' },
              'All caught up — no pending items.'
            )
          );
          return card;
        }

        const list = UI.createElement('div', { style: 'display:flex;flex-direction:column;gap:0.6rem;' });
        rows.forEach(item => list.appendChild(renderRow(item)));
        card.appendChild(list);
        return card;
      }

      function renderPendingActions(pa) {
        const host = document.getElementById('pendingActionsContainer');
        host.innerHTML = '';

        const outpasses = pa.outpasses || [];
        host.appendChild(renderActionSectionCard(
          'Outpasses Awaiting Approval', `${outpasses.length}`, outpasses.length ? 'badge-pending' : 'badge-active',
          '/warden/outpasses.html?status=PENDING', 'Review All',
          outpasses,
          o => UI.createElement('div', { style: 'padding:0.6rem 0.75rem;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--card-bg);' },
            UI.createElement('div', { style: 'font-weight:600;font-size:var(--font-size-secondary);' }, o.studentName, ' (', UI.createElement('span', { className: 'reg-no-code' }, o.registerNumber), ')'),
            UI.createElement('div', { style: 'font-size:var(--font-size-helper);color:var(--text-muted);' }, `${o.passType} • ${UI.formatDateTime(o.departureDateTime)} • ${o.reason}`)
          )
        ));

        const locked = pa.lockedStudents || [];
        host.appendChild(renderActionSectionCard(
          'Missed Attendance — Locked Students', `${locked.length}`, locked.length ? 'badge-absent' : 'badge-active',
          '/warden/attendance?tab=missed', 'Manage Locks',
          locked,
          st => UI.createElement('div', { style: 'padding:0.6rem 0.75rem;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--card-bg);' },
            UI.createElement('div', { style: 'font-weight:600;font-size:var(--font-size-secondary);' }, st.fullName, ' (', UI.createElement('span', { className: 'reg-no-code' }, st.registerNumber), ')'),
            UI.createElement('div', { style: 'font-size:var(--font-size-helper);color:var(--text-muted);' }, st.lockReason || 'Missed attendance lock')
          )
        ));

        const parcels = pa.longPendingParcels || [];
        host.appendChild(renderActionSectionCard(
          'Long-Pending Parcels (>7d)', `${parcels.length}`, parcels.length ? 'badge-absent' : 'badge-active',
          '/warden/parcels.html?tab=register&filter=long-pending', 'Open Parcels',
          parcels,
          p => UI.createElement('div', { style: 'padding:0.6rem 0.75rem;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--card-bg);' },
            UI.createElement('div', { style: 'font-weight:600;font-size:var(--font-size-secondary);' }, UI.createElement('span', { className: 'parcel-id' }, p.parcelCode), ` • ${p.studentName}`),
            UI.createElement('div', { style: 'font-size:var(--font-size-helper);color:var(--text-muted);' }, `${p.courierName}${p.cod ? ' (COD)' : ''} • Received ${UI.formatDateTime(p.receivedAt)}`)
          )
        ));

        const maint = pa.openMaintenance || [];
        host.appendChild(renderActionSectionCard(
          'Open Maintenance Requests', `${maint.length}`, maint.length ? 'badge-late' : 'badge-active',
          '/warden/maintenance.html?tab=requests&status=OPEN', 'Open Maintenance',
          maint,
          m => UI.createElement('div', { style: 'padding:0.6rem 0.75rem;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--card-bg);' },
            UI.createElement('div', { style: 'font-weight:600;font-size:var(--font-size-secondary);' }, UI.createElement('span', { className: 'request-id' }, m.requestCode), ` • ${m.title}`),
            UI.createElement('div', { style: 'font-size:var(--font-size-helper);color:var(--text-muted);' }, `Room ${m.roomNumber} • Priority ${m.priority} • ${m.status}`)
          )
        ));

        const circ = pa.unackCirculars || [];
        host.appendChild(renderActionSectionCard(
          'Published Circulars Requiring Ack', `${circ.length}`, circ.length ? 'badge-pending' : 'badge-active',
          '/warden/circulars.html?status=PUBLISHED', 'Open Circulars',
          circ,
          c => UI.createElement('div', { style: 'padding:0.6rem 0.75rem;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--card-bg);' },
            UI.createElement('div', { style: 'font-weight:600;font-size:var(--font-size-secondary);' }, UI.createElement('span', { className: 'tech-code' }, c.circularCode), ` • ${c.title}`),
            UI.createElement('div', { style: 'font-size:var(--font-size-helper);color:var(--text-muted);' }, `Priority ${c.priority} • Published ${UI.formatDateTime(c.publishedAt)}`)
          )
        ));
      }

      function renderRecentActivity(list) {
        const tbody = document.getElementById('recentActivityBody');
        tbody.innerHTML = '';
        if (!list || list.length === 0) {
          tbody.appendChild(UI.createElement('tr', {},
            UI.createElement('td', { colSpan: 6, style: 'text-align:center;padding:2rem;color:var(--text-muted);' }, 'No recent audit events recorded.')
          ));
          return;
        }
        list.forEach(item => {
          const ok = String(item.result || '').toUpperCase().includes('SUCCESS');
          tbody.appendChild(UI.createElement('tr', {},
            UI.createElement('td', { dataset: { label: 'Time (IST)' }, style: 'white-space:nowrap;' }, UI.formatDateTime(item.createdAt)),
            UI.createElement('td', { dataset: { label: 'Module' } }, UI.createElement('span', { className: 'status-badge badge-active' }, item.module || 'SYSTEM')),
            UI.createElement('td', { dataset: { label: 'Action' }, style: 'font-weight:600;' }, item.action || '-'),
            UI.createElement('td', { dataset: { label: 'Actor' } }, item.actorName || 'System'),
            UI.createElement('td', { dataset: { label: 'Target' }, style: 'color:var(--text-muted);' }, item.target || '-'),
            UI.createElement('td', { dataset: { label: 'Result' } }, UI.createElement('span', { className: `status-badge ${ok ? 'badge-present' : 'badge-absent'}` }, item.result || '-'))
          ));
        });
      }

      document.getElementById('btnRefreshDashboard').addEventListener('click', loadDashboardOverview);
      await loadDashboardOverview();
    })();
  </script>
</body>
</html>
