<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcels - PSG iTech Hostel</title>
  <link rel="icon" type="image/png" href="/img/psgitech_logo.png">
  <link rel="stylesheet" href="/css/common.css">
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <div id="app-layout" class="app-container">
    <main class="main-content">
      <div class="page-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Hostel Parcel Desk</h1>
            <p class="page-subtitle">Verify pickup QR codes, register arrived parcels, track COD payments, and export parcel logs.</p>
          </div>
          <div style="display:flex;gap:0.6rem;flex-wrap:wrap;">
            <a href="/api/warden/parcels/export" class="btn btn-secondary btn-sm">Export CSV</a>
          </div>
        </div>

        <!-- Reusable SummaryCards Strip -->
        <div id="parcelSummaryCards"></div>

        <!-- URL-synced Scrollable Tabs -->
        <div class="portal-tabs" id="parcelMainTabs">
          <button type="button" class="portal-tab-btn active" data-tab="scan">Scan QR / Deliver</button>
          <button type="button" class="portal-tab-btn" data-tab="add">Add Parcel</button>
          <button type="button" class="portal-tab-btn" data-tab="register">Parcel Register</button>
        </div>

        <!-- TAB 1: SCAN QR / DELIVER (Default) -->
        <section id="panel-scan" data-tab-panel="scan">
          <div class="card" style="margin-bottom:1.5rem;">
            <div class="card-header" style="flex-wrap:wrap;gap:0.75rem;">
              <h2 class="card-title">Camera Scanner &amp; Manual Lookup</h2>
              <div style="display:flex;gap:0.5rem;">
                <button type="button" class="btn btn-primary btn-sm" id="btnStartCam">Open Camera Scanner</button>
                <button type="button" class="btn btn-secondary btn-sm" id="btnStopCam" style="display:none;">Stop Camera</button>
              </div>
            </div>
            <div id="qrReaderWrap" style="max-width:400px;margin:0 auto 1rem;display:none;">
              <div id="qrReader" style="width:100%;"></div>
            </div>
            <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
              <input type="text" id="manualCodeInput" class="form-control" style="flex:1;min-width:240px;" placeholder="Enter QR Token, Parcel ID (PRC-2026-0001), or 6-digit Pickup Code...">
              <button type="button" class="btn btn-primary" id="btnVerifyCode">Verify Parcel</button>
            </div>
          </div>
          <div id="scanResultBox" style="display:none;" class="card"></div>
        </section>

        <!-- TAB 2: ADD PARCEL -->
        <section id="panel-add" data-tab-panel="add" style="display:none;">
          <div class="card" style="max-width:740px;">
            <div class="card-header">
              <h2 class="card-title">Register Arrived Parcel</h2>
            </div>
            <form id="addParcelForm">
              <div class="form-group">
                <label class="form-label">Find Student (Name / Roll No / Room) *</label>
                <div style="display:flex;gap:0.5rem;margin-bottom:0.4rem;">
                  <input type="text" id="studentSearchBox" class="form-control" placeholder="Type name, roll no, or room to filter...">
                  <button type="button" class="btn btn-secondary btn-sm" id="btnFindStudent">Find</button>
                </div>
                <select id="studentSelect" class="form-control" required></select>
              </div>

              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0.75rem;">
                <div class="form-group">
                  <label class="form-label">Courier / Sender *</label>
                  <input type="text" id="pCourier" class="form-control" list="courierPresets" required placeholder="e.g. Amazon, Flipkart">
                  <datalist id="courierPresets">
                    <option value="Amazon"><option value="Flipkart"><option value="Myntra">
                    <option value="BlueDart"><option value="Delhivery"><option value="India Post">
                  </datalist>
                </div>
                <div class="form-group">
                  <label class="form-label">Parcel Type / Size *</label>
                  <select id="pType" class="form-control" required>
                    <option value="SMALL">Small</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="LARGE">Large</option>
                    <option value="FRAGILE">Fragile</option>
                    <option value="COD">Cash on Delivery (COD)</option>
                  </select>
                </div>
              </div>

              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0.75rem;">
                <div class="form-group">
                  <label class="form-label">Tracking / AWB (Optional)</label>
                  <input type="text" id="pTracking" class="form-control" placeholder="e.g. AWB123456">
                </div>
                <div class="form-group">
                  <label class="form-label">Storage Shelf (Optional)</label>
                  <input type="text" id="pShelf" class="form-control" placeholder="e.g. Shelf A-04">
                </div>
              </div>

              <div class="form-group">
                <label style="font-weight:700;cursor:pointer;">
                  <input type="checkbox" id="pIsCod"> Cash-on-Delivery (Payment Pending)
                </label>
                <input type="number" step="0.01" min="1" id="pCodAmount" class="form-control" style="margin-top:0.4rem;display:none;" placeholder="Enter COD Amount (Rs.)">
              </div>

              <div class="form-group">
                <label class="form-label">Description / Remarks (Optional)</label>
                <input type="text" id="pDesc" class="form-control" maxlength="500" placeholder="e.g. Medium cardboard box">
              </div>

              <div class="form-group">
                <label class="form-label">Parcel Photo (Optional, JPG/PNG/WebP &le; 2MB)</label>
                <input type="file" id="pPhoto" class="form-control" accept="image/jpeg,image/png,image/webp">
              </div>

              <div style="display:flex;justify-content:flex-end;gap:0.75rem;">
                <button type="reset" class="btn btn-secondary">Clear</button>
                <button type="button" class="btn btn-primary" id="btnSubmitParcel">Register &amp; Notify Student</button>
              </div>
            </form>
          </div>
        </section>

        <!-- TAB 3: PARCEL REGISTER -->
        <section id="panel-register" data-tab-panel="register" style="display:none;">
          <div class="card" style="padding:1.25rem;margin-bottom:1.25rem;">
            <div style="display:flex;gap:0.65rem;flex-wrap:wrap;align-items:end;">
              <div style="flex:1;min-width:200px;">
                <label class="form-label">Search (Parcel ID / Student / Courier)</label>
                <input type="text" id="filterQuery" class="form-control" placeholder="PRC-2026, REG202609, Amazon...">
              </div>
              <div>
                <label class="form-label">Status</label>
                <select id="filterStatus" class="form-control" style="width:170px;">
                  <option value="">All Statuses</option>
                  <option value="NOTIFIED">Waiting for Pickup</option>
                  <option value="RECEIVED">Received</option>
                  <option value="DELIVERED">Delivered</option>
                  <option value="RETURNED_TO_SENDER">Returned to Sender</option>
                  <option value="UNCLAIMED">Unclaimed</option>
                  <option value="CANCELLED">Cancelled</option>
                </select>
              </div>
              <div>
                <label class="form-label">Courier</label>
                <input type="text" id="filterCourier" class="form-control" style="width:130px;" placeholder="Amazon...">
              </div>
              <div>
                <label class="form-label">From Date</label>
                <input type="date" id="filterFrom" class="form-control" style="width:145px;">
              </div>
              <button type="button" class="btn btn-primary btn-sm" id="btnFilter">Search</button>
              <button type="button" class="btn btn-secondary btn-sm" id="btnLongPendingFilter">Long-Pending</button>
            </div>
          </div>

          <div class="card">
            <div class="table-responsive">
              <table class="data-table mobile-collapse-table">
                <thead>
                  <tr>
                    <th>Parcel ID</th>
                    <th>Student &amp; Room</th>
                    <th>Courier &amp; Type</th>
                    <th>COD</th>
                    <th>Shelf</th>
                    <th>Received</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="parcelsBody">
                  <tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-muted);">Loading parcels...</td></tr>
                </tbody>
              </table>
            </div>
            <div id="paginationBar" style="display:flex;justify-content:space-between;align-items:center;padding:1rem 0 0;flex-wrap:wrap;gap:0.75rem;"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/ui.js?v=4"></script>
  <script src="/js/maintenance-ui.js"></script>
  <script>
    (async () => {
      const user = await Auth.requireAuth(['WARDEN', 'ADMIN']);
      if (!user) return;
      UI.renderLayout(user, 'parcels');

      let currentPage = 0;
      let html5Qr = null;
      let activeCardFilter = null;
      let highlightCode = null;
      let tabsCtrl = null;

      // QR Scanner logic
      document.getElementById('btnStartCam').addEventListener('click', async () => {
        if (typeof Html5Qrcode === 'undefined') { UI.showToast('Camera library unavailable; use manual input.', 'info'); return; }
        document.getElementById('qrReaderWrap').style.display = 'block';
        document.getElementById('btnStartCam').style.display = 'none';
        document.getElementById('btnStopCam').style.display = 'inline-flex';
        html5Qr = new Html5Qrcode('qrReader');
        try {
          await html5Qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 240 } },
            (txt) => { document.getElementById('manualCodeInput').value = txt; stopCamera(); verifyToken(txt); });
        } catch (err) { UI.showToast('Camera unavailable on this device.', 'error'); stopCamera(); }
      });

      async function stopCamera() {
        if (html5Qr) { try { await html5Qr.stop(); } catch (e) {} html5Qr = null; }
        document.getElementById('qrReaderWrap').style.display = 'none';
        document.getElementById('btnStartCam').style.display = 'inline-flex';
        document.getElementById('btnStopCam').style.display = 'none';
      }
      document.getElementById('btnStopCam').addEventListener('click', stopCamera);

      async function verifyToken(codeArg) {
        const code = (codeArg || document.getElementById('manualCodeInput').value).trim();
        if (!code) { UI.showToast('Enter QR token, Parcel ID, or 6-digit pickup code', 'error'); return; }
        const res = await fetch(`/api/warden/parcels/verify-qr?tokenOrCode=${encodeURIComponent(code)}`, { credentials: 'same-origin' });
        const data = await res.json();
        const box = document.getElementById('scanResultBox');
        box.innerHTML = '';
        box.style.display = 'block';

        if (!res.ok || !data.valid) {
          box.appendChild(UI.createElement('div', { className: 'lock-alert-banner' },
            UI.createElement('span', { style: 'font-size:1.75rem;' }, '❌'),
            UI.createElement('div', {},
              UI.createElement('strong', { style: 'font-size:1.05rem;' }, 'VERIFICATION FAILED'),
              UI.createElement('div', { style: 'margin-top:0.25rem;' }, data.errorMessage || data.message || 'Invalid QR or parcel cannot be delivered')
            )
          ));
          if (!data.parcel) return;
        } else {
          box.appendChild(UI.createElement('div', {
            style: 'background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;padding:0.9rem 1.25rem;border-radius:var(--radius-md);margin-bottom:1.25rem;font-weight:700;'
          }, 'Valid Parcel Verified — Ready for Delivery Confirmation'));
        }

        const p = data.parcel;
        box.appendChild(UI.createElement('div', {
          style: 'background:var(--card-bg);padding:1.25rem;border-radius:var(--radius-md);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0.75rem;margin-bottom:1.25rem;font-size:0.92rem;'
        },
          UI.createElement('div', {}, UI.createElement('strong', {}, 'Parcel ID: '), p.parcelCode),
          UI.createElement('div', {}, UI.createElement('strong', {}, 'Student: '), `${p.studentName} (${p.studentRegNo})`),
          UI.createElement('div', {}, UI.createElement('strong', {}, 'Room / Block: '), `Room ${p.studentRoom} (${p.hostelBlock})`),
          UI.createElement('div', {}, UI.createElement('strong', {}, 'Courier & Type: '), `${p.courierName} (${p.parcelType})`),
          UI.createElement('div', {}, UI.createElement('strong', {}, 'Shelf: '), p.storageLocation || '—'),
          UI.createElement('div', {}, UI.createElement('strong', {}, 'Description: '), p.description || '—'),
          UI.createElement('div', {}, UI.createElement('strong', {}, 'COD Status: '), p.cod ? `Rs. ${p.codAmount} (${p.codPaymentPending ? 'Pending' : 'Collected'})` : 'Prepaid'),
          UI.createElement('div', {}, UI.createElement('strong', {}, 'Current Status: '), p.status)
        ));

        if (p.attachments && p.attachments.length > 0) {
          const grid = UI.createElement('div', { className: 'photo-thumb-grid', style: 'margin-bottom:1rem;' });
          p.attachments.forEach(a => grid.appendChild(UI.createElement('img', { src: a.url, className: 'photo-thumb' })));
          box.appendChild(grid);
        }

        if (data.valid) {
          const form = UI.createElement('div', { style: 'display:flex;flex-direction:column;gap:0.85rem;' });
          let chkCod = null;
          if (p.cod && p.codPaymentPending) {
            chkCod = UI.createElement('input', { type: 'checkbox', id: 'chkCodPaid' });
            form.appendChild(UI.createElement('label', {
              style: 'background:#fef2f2;border:1px solid #fecaca;padding:0.75rem 1rem;border-radius:var(--radius-md);font-weight:700;color:#b91c1c;cursor:pointer;display:flex;align-items:center;gap:0.5rem;'
            }, chkCod, ` Confirm COD Payment Collected: Rs. ${p.codAmount}`));
          }

          const chkFriend = UI.createElement('input', { type: 'checkbox', id: 'chkFriend' });
          const friendWrap = UI.createElement('div', { style: 'display:none;grid-template-columns:1fr 1fr;gap:0.75rem;' });
          const friendName = UI.createElement('input', { type: 'text', className: 'form-control', placeholder: 'Receiver (Friend) Name *' });
          const friendReason = UI.createElement('input', { type: 'text', className: 'form-control', placeholder: 'Reason for friend handover *' });
          friendWrap.append(friendName, friendReason);
          chkFriend.addEventListener('change', () => { friendWrap.style.display = chkFriend.checked ? 'grid' : 'none'; });

          const remarksInput = UI.createElement('input', { type: 'text', className: 'form-control', placeholder: 'Delivery remarks (optional)' });
          const btnDeliver = UI.createElement('button', {
            type: 'button', className: 'btn btn-success',
            onclick: async () => {
              if (chkCod && !chkCod.checked) { UI.showToast('Please confirm COD payment was collected before delivering', 'error'); return; }
              const resDel = await fetch('/api/warden/parcels/deliver', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
                body: JSON.stringify({
                  parcelId: p.id,
                  paymentCollected: chkCod ? chkCod.checked : true,
                  remarks: remarksInput.value.trim(),
                  handoverToName: chkFriend.checked ? friendName.value.trim() : null,
                  handoverReason: chkFriend.checked ? friendReason.value.trim() : null
                })
              });
              const delData = await resDel.json();
              if (!resDel.ok) UI.showToast(delData.message || 'Delivery confirmation failed', 'error');
              else {
                UI.showToast(`Parcel ${delData.parcelCode} delivered & student notified!`, 'success');
                await Promise.all([verifyToken(p.parcelCode), loadSummary(), loadParcels(currentPage)]);
              }
            }
          }, 'Confirm Delivery');

          form.append(
            UI.createElement('label', { style: 'font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.5rem;' }, chkFriend, ' Handing over on behalf of student (Friend)'),
            friendWrap, remarksInput, btnDeliver
          );
          box.appendChild(form);
        }
      }

      // Add Parcel logic
      document.getElementById('pIsCod').addEventListener('change', e => {
        document.getElementById('pCodAmount').style.display = e.target.checked ? 'block' : 'none';
      });
      document.getElementById('pType').addEventListener('change', e => {
        if (e.target.value === 'COD') {
          document.getElementById('pIsCod').checked = true;
          document.getElementById('pCodAmount').style.display = 'block';
        }
      });

      async function loadStudents(q = '') {
        const res = await fetch(`/api/warden/parcels/students?query=${encodeURIComponent(q)}`, { credentials: 'same-origin' });
        const sel = document.getElementById('studentSelect');
        sel.innerHTML = '';
        if (!res.ok) return;
        (await res.json()).forEach(s => {
          sel.appendChild(UI.createElement('option', { value: s.id }, `${s.fullName} (${s.registerNumber}) — Room ${s.roomNumber}`));
        });
      }

      async function loadSummary() {
        const res = await fetch('/api/warden/parcels/summary', { credentials: 'same-origin' });
        if (!res.ok) return;
        const s = await res.json();
        UI.SummaryCards.render('parcelSummaryCards', {
          activeKey: activeCardFilter,
          onSelect: async (key) => {
            activeCardFilter = (activeCardFilter === key) ? null : key;
            tabsCtrl.switchTo('register');
            if (activeCardFilter === 'LONG_PENDING') {
              const lpRes = await fetch('/api/warden/parcels/long-pending', { credentials: 'same-origin' });
              if (lpRes.ok) renderParcelRows(await lpRes.json(), false);
            } else {
              document.getElementById('filterStatus').value = activeCardFilter || '';
              if (activeCardFilter === 'REC_TODAY' || activeCardFilter === 'DEL_TODAY') {
                document.getElementById('filterFrom').value = new Date().toISOString().slice(0, 10);
                document.getElementById('filterStatus').value = activeCardFilter === 'DEL_TODAY' ? 'DELIVERED' : '';
              } else if (!activeCardFilter) {
                document.getElementById('filterFrom').value = '';
              }
              await loadParcels(0);
            }
            loadSummary();
          },
          cards: [
            { key: 'REC_TODAY', label: 'Received Today', value: s.receivedToday, accentColor: '#0284c7' },
            { key: 'NOTIFIED', label: 'Waiting Pickup', value: s.waitingForPickup, accentColor: '#f59e0b', valColor: '#b45309' },
            { key: 'DEL_TODAY', label: 'Delivered Today', value: s.deliveredToday, accentColor: '#16a34a', valColor: '#15803d' },
            { key: 'LONG_PENDING', label: 'Long-Pending (>7d)', value: s.longPending, accentColor: '#dc2626', valColor: '#b91c1c' },
            { key: 'COD', label: 'COD Pending', value: s.codPending, accentColor: '#7c3aed', filterable: false }
          ],
          chartTitle: 'Today & Waiting Parcel Status',
          chartSegments: [
            { label: 'Waiting Pickup', value: s.waitingForPickup, color: '#f59e0b' },
            { label: 'Delivered Today', value: s.deliveredToday, color: '#16a34a' },
            { label: 'Long-Pending', value: s.longPending, color: '#dc2626' }
          ]
        });
      }

      async function loadParcels(page = 0) {
        currentPage = page;
        const params = new URLSearchParams({ page, size: 10 });
        const q = document.getElementById('filterQuery').value.trim();
        const st = document.getElementById('filterStatus').value;
        const c = document.getElementById('filterCourier').value.trim();
        const f = document.getElementById('filterFrom').value;
        if (q) params.append('query', q);
        if (st) params.append('status', st);
        if (c) params.append('courier', c);
        if (f) params.append('fromDate', f);
        const res = await fetch(`/api/warden/parcels?${params.toString()}`, { credentials: 'same-origin' });
        if (res.ok) renderParcelRows(await res.json(), true);
      }

      function renderParcelRows(pageOrList, isPage) {
        const tbody = document.getElementById('parcelsBody');
        tbody.innerHTML = '';
        const list = isPage ? (pageOrList.content || []) : pageOrList;
        if (list.length === 0) {
          tbody.appendChild(UI.createElement('tr', {}, UI.createElement('td', { colSpan: 8, style: 'text-align:center;padding:2rem;color:var(--text-muted);' }, 'No parcels found.')));
        } else {
          let scrollRow = null;
          list.forEach(p => {
            const act = UI.createElement('div', { style: 'display:flex;gap:0.35rem;flex-wrap:wrap;' });
            if (p.status === 'RECEIVED' || p.status === 'NOTIFIED') {
              act.appendChild(UI.createElement('button', {
                className: 'btn btn-primary btn-sm',
                onclick: () => {
                  document.getElementById('manualCodeInput').value = p.parcelCode;
                  tabsCtrl.switchTo('scan');
                  verifyToken(p.parcelCode);
                }
              }, 'Deliver'));
              act.appendChild(UI.createElement('button', {
                className: 'btn btn-secondary btn-sm',
                onclick: () => markStatus(p.id, 'return-sender', 'Return to Sender', p.parcelCode)
              }, 'Return'));
              act.appendChild(UI.createElement('button', {
                className: 'btn btn-danger btn-sm',
                onclick: () => markStatus(p.id, 'unclaimed', 'Mark Unclaimed', p.parcelCode)
              }, 'Unclaimed'));
            }
            const isNew = highlightCode && p.parcelCode === highlightCode;
            const tr = UI.createElement('tr', { className: isNew ? 'row-highlight' : '' },
              UI.createElement('td', { dataset: { label: 'ID' } },
                UI.createElement('strong', {}, p.parcelCode),
                p.longPending ? UI.createElement('div', { style: 'font-size:0.72rem;color:#dc2626;font-weight:700;' }, `Long-pending (${p.daysWaiting}d)`) : null
              ),
              UI.createElement('td', { dataset: { label: 'Student' } },
                UI.createElement('div', { style: 'font-weight:600;' }, p.studentName),
                UI.createElement('div', { style: 'font-size:0.78rem;color:var(--text-muted);' }, `${p.studentRegNo} · Room ${p.studentRoom}`)
              ),
              UI.createElement('td', { dataset: { label: 'Courier' } }, `${p.courierName} (${p.parcelType})`),
              UI.createElement('td', { dataset: { label: 'COD' } }, p.cod ? `Rs. ${p.codAmount}` : 'Prepaid'),
              UI.createElement('td', { dataset: { label: 'Shelf' } }, p.storageLocation || '—'),
              UI.createElement('td', { dataset: { label: 'Received' }, style: 'font-size:0.8rem;' }, UI.formatDateTime(p.receivedAt)),
              UI.createElement('td', { dataset: { label: 'Status' } }, UI.parcelStatusBadge(p.status)),
              UI.createElement('td', { dataset: { label: 'Actions' } }, act)
            );
            if (isNew) scrollRow = tr;
            tbody.appendChild(tr);
          });
          if (scrollRow) { scrollRow.scrollIntoView({ behavior: 'smooth', block: 'center' }); highlightCode = null; }
        }
        if (isPage) MaintUI.renderPagination(document.getElementById('paginationBar'), pageOrList, p => loadParcels(p));
        else document.getElementById('paginationBar').innerHTML = '';
      }

      async function markStatus(id, endpoint, label, code) {
        const reason = prompt(`Enter mandatory reason to ${label} for ${code}:`);
        if (!reason || !reason.trim()) return;
        const res = await fetch(`/api/warden/parcels/${id}/${endpoint}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
          body: JSON.stringify({ reason: reason.trim() })
        });
        if (res.ok) { UI.showToast(`Parcel ${code} updated.`, 'success'); await Promise.all([loadSummary(), loadParcels(currentPage)]); }
      }

      document.getElementById('btnFindStudent').addEventListener('click', () => loadStudents(document.getElementById('studentSearchBox').value.trim()));
      document.getElementById('btnVerifyCode').addEventListener('click', () => verifyToken());
      document.getElementById('manualCodeInput').addEventListener('keydown', e => { if (e.key === 'Enter') verifyToken(); });

      document.getElementById('btnSubmitParcel').addEventListener('click', async () => {
        const sid = document.getElementById('studentSelect').value;
        const courier = document.getElementById('pCourier').value.trim();
        if (!sid || !courier) { UI.showToast('Student and courier name are required', 'error'); return; }
        const fd = new FormData();
        fd.append('studentId', sid);
        fd.append('courierName', courier);
        fd.append('parcelType', document.getElementById('pType').value);
        const trk = document.getElementById('pTracking').value.trim();
        if (trk) fd.append('trackingNumber', trk);
        const shelf = document.getElementById('pShelf').value.trim();
        if (shelf) fd.append('storageLocation', shelf);
        const desc = document.getElementById('pDesc').value.trim();
        if (desc) fd.append('description', desc);
        const isCod = document.getElementById('pIsCod').checked;
        fd.append('cod', isCod ? 'true' : 'false');
        if (isCod) fd.append('codAmount', document.getElementById('pCodAmount').value);
        const photo = document.getElementById('pPhoto').files[0];
        if (photo) fd.append('photo', photo);

        const res = await fetch('/api/warden/parcels', { method: 'POST', credentials: 'same-origin', body: fd });
        const data = await res.json();
        if (!res.ok) UI.showToast(data.message || 'Failed to register parcel', 'error');
        else {
          UI.showToast(`Registered ${data.parcelCode} & notified ${data.studentName}`, 'success');
          highlightCode = data.parcelCode;
          document.getElementById('addParcelForm').reset();
          document.getElementById('pCodAmount').style.display = 'none';
          await Promise.all([loadSummary(), loadParcels(0)]);
          tabsCtrl.switchTo('register');
        }
      });

      document.getElementById('btnFilter').addEventListener('click', () => loadParcels(0));
      document.getElementById('btnLongPendingFilter').addEventListener('click', async () => {
        const res = await fetch('/api/warden/parcels/long-pending', { credentials: 'same-origin' });
        if (res.ok) renderParcelRows(await res.json(), false);
      });

      tabsCtrl = UI.Tabs.init({ barSelector: '#parcelMainTabs', defaultTab: 'scan' });
      await Promise.all([loadSummary(), loadStudents(''), loadParcels(0)]);

      const urlCode = new URLSearchParams(window.location.search).get('code');
      if (urlCode) {
        document.getElementById('manualCodeInput').value = urlCode;
        tabsCtrl.switchTo('scan');
        await verifyToken(urlCode);
      }
    })();
  </script>
</body>
</html>
