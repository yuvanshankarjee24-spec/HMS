<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mess Tokens - PSG iTech Hostel</title>
  <link rel="icon" type="image/png" href="/img/psgitech_logo.png">
  <link rel="stylesheet" href="/css/common.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .tab-bar { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.25rem; }
    .tab-btn { padding:0.55rem 1.15rem; border-radius:var(--radius-full); border:1px solid var(--border-light); background:#fff; font-weight:700; font-size:0.85rem; color:var(--text-muted); cursor:pointer; }
    .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .tokens-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:1.25rem; }
    .token-card { background:#fff; border:1px solid var(--border-light); border-radius:var(--radius-lg); padding:1.35rem; display:flex; flex-direction:column; gap:0.75rem; box-shadow:var(--shadow-sm); }
  </style>
</head>
<body>
  <div id="app-layout" class="app-container">
    <main class="main-content">
      <div class="page-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">My Mess Tokens</h1>
            <p class="page-subtitle">QR activates automatically 15 minutes before the meal starts. Show it at the mess counter.</p>
          </div>
          <div>
            <a href="/student/mess-booking.html" class="btn btn-primary btn-sm">+ Book New Token</a>
          </div>
        </div>

        <div class="tab-bar" id="tokenTabs">
          <button type="button" class="tab-btn active" data-tab="UPCOMING">Upcoming</button>
          <button type="button" class="tab-btn" data-tab="DELIVERED">Delivered</button>
          <button type="button" class="tab-btn" data-tab="PAST">Cancelled / Expired</button>
        </div>

        <div id="tokensGrid" class="tokens-grid"></div>
        <div id="paginationBar" style="display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0 0;"></div>
      </div>
    </main>
  </div>

  <!-- Bright QR Overlay -->
  <div id="qrFullscreen" class="qr-fullscreen-overlay">
    <div style="max-width:400px;width:100%;">
      <div style="font-size:0.82rem;font-weight:700;text-transform:uppercase;color:#64748b;margin-bottom:0.4rem;">Present at Mess Counter</div>
      <h2 id="qrTokenTitle" style="font-size:1.65rem;font-weight:800;color:#0f172a;margin-bottom:0.25rem;">TKN-2026-00001</h2>
      <p id="qrTokenSub" style="color:#475569;margin-bottom:1.1rem;font-size:0.95rem;"></p>

      <div class="qr-box-bright">
        <div id="qrRenderBox"></div>
        <div style="border-top:1px dashed #cbd5e1;width:100%;padding-top:0.75rem;">
          <div style="font-size:0.75rem;color:#64748b;text-transform:uppercase;font-weight:700;">6-Digit Pickup Code</div>
          <div id="qrPickupCode" style="font-size:1.75rem;font-weight:800;letter-spacing:0.2em;color:#0f172a;margin-top:0.2rem;">000000</div>
        </div>
      </div>

      <div style="margin-top:1.5rem;">
        <button type="button" class="btn btn-primary" style="width:100%;" onclick="document.getElementById('qrFullscreen').classList.remove('active')">Close QR View</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/ui.js?v=3"></script>
  <script src="/js/maintenance-ui.js"></script>
  <script>
    (async () => {
      const user = await Auth.requireAuth(['STUDENT']);
      if (!user) return;
      UI.renderLayout(user, 'my-tokens');

      let currentTab = 'UPCOMING';
      let currentPage = 0;
      let timers = [];

      function fmtSec(secs) {
        const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
        return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
      }

      document.querySelectorAll('#tokenTabs .tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#tokenTabs .tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTab = btn.dataset.tab;
          loadTokens(0);
        });
      });

      async function loadTokens(page = 0) {
        currentPage = page;
        timers.forEach(clearInterval);
        timers = [];
        const res = await fetch(`/api/student/mess/tokens?tab=${currentTab}&page=${page}&size=12`, { credentials: 'same-origin' });
        const grid = document.getElementById('tokensGrid');
        grid.innerHTML = '';
        if (!res.ok) return;
        const pageData = await res.json();
        const list = pageData.content || [];

        if (list.length === 0) {
          grid.appendChild(UI.createElement('div', { className: 'card', style: 'grid-column:1/-1;padding:2rem;text-align:center;color:var(--text-muted);' }, 'No mess tokens in this tab.'));
        } else {
          list.forEach(t => {
            const card = UI.createElement('div', { className: 'token-card' });
            const itemsUl = UI.createElement('ul', { style: 'margin:0;padding-left:1.15rem;font-size:0.88rem;color:var(--text-main);' });
            (t.items || []).forEach(i => {
              itemsUl.appendChild(UI.createElement('li', {}, `${i.foodName} x ${i.quantity} (Rs. ${Number(i.lineTotal).toFixed(2)})`));
            });

            card.append(
              UI.createElement('div', { style: 'display:flex;justify-content:space-between;align-items:flex-start;' },
                UI.createElement('div', {},
                  UI.createElement('strong', { style: 'font-size:1.05rem;' }, t.tokenCode),
                  UI.createElement('div', { style: 'font-size:0.84rem;color:var(--primary);font-weight:700;' }, `${t.menuDate} · ${t.period}`)
                ),
                UI.tokenStatusBadge(t.status)
              ),
              itemsUl,
              UI.createElement('div', { style: 'font-weight:800;font-size:0.95rem;' }, `Total: Rs. ${Number(t.totalAmount).toFixed(2)}`)
            );

            if (t.qrLockedBeforeWindow) {
              const lockPill = UI.createElement('div', { className: 'countdown-pill', style: 'justify-content:center;' },
                `QR locked · Opens at ${UI.formatDateTime(t.qrOpensAt)} (${fmtSec(t.secondsUntilQrOpens)})`);
              card.appendChild(lockPill);
              let rem = t.secondsUntilQrOpens;
              const tm = setInterval(() => {
                rem--;
                if (rem <= 0) { clearInterval(tm); loadTokens(currentPage); }
                else lockPill.textContent = `QR opens in ${fmtSec(rem)} (${UI.formatDateTime(t.qrOpensAt)})`;
              }, 1000);
              timers.push(tm);
            } else if (t.qrCurrentlyActive && t.qrToken) {
              card.appendChild(UI.createElement('button', {
                className: 'btn btn-success',
                style: 'width:100%;',
                onclick: () => openQr(t)
              }, 'Show Active QR'));
            }

            if (t.cancellable) {
              card.appendChild(UI.createElement('button', {
                className: 'btn btn-danger btn-sm',
                onclick: async () => {
                  const ok = await UI.showConfirm({ title: 'Cancel Token', message: `Cancel ${t.tokenCode} and release stock?`, confirmText: 'Yes, Cancel' });
                  if (!ok) return;
                  const cr = await fetch(`/api/student/mess/tokens/${t.id}/cancel`, { method: 'POST', credentials: 'same-origin' });
                  if (cr.ok) {
                    UI.showToast('Token cancelled and stock released.', 'success');
                    loadTokens(currentPage);
                  } else {
                    const err = await cr.json();
                    UI.showToast(err.message || 'Cannot cancel', 'error');
                  }
                }
              }, 'Cancel Before Cutoff'));
            }
            grid.appendChild(card);
          });
        }
        MaintUI.renderPagination(document.getElementById('paginationBar'), pageData, p => loadTokens(p));
      }

      function openQr(t) {
        document.getElementById('qrTokenTitle').textContent = t.tokenCode;
        document.getElementById('qrTokenSub').textContent = `${t.menuDate} · ${t.period}`;
        document.getElementById('qrPickupCode').textContent = t.pickupCode || '------';
        const box = document.getElementById('qrRenderBox');
        box.innerHTML = '';
        if (typeof QRCode !== 'undefined' && t.qrToken) {
          new QRCode(box, { text: t.qrToken, width: 220, height: 220 });
        } else {
          box.textContent = t.qrToken;
        }
        document.getElementById('qrFullscreen').classList.add('active');
      }

      await loadTokens(0);
    })();
  </script>
</body>
</html>
