<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Parcels - PSG iTech Hostel</title>
  <link rel="icon" type="image/png" href="/img/psgitech_logo.png">
  <link rel="stylesheet" href="/css/common.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .tab-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .tab-btn {
      padding: 0.55rem 1.15rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }
    .parcels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.25rem;
    }
    .parcel-card {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.35rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
  </style>
</head>
<body>
  <div id="app-layout" class="app-container">
    <main class="main-content">
      <div class="page-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">My Parcels &amp; Deliveries</h1>
            <p class="page-subtitle">View arrived packages, show your pickup QR code at the warden desk, and track delivery history.</p>
          </div>
          <div>
            <span id="waitingCountPill" class="status-badge badge-prc-notified">0 Waiting</span>
          </div>
        </div>

        <div class="tab-bar" id="parcelTabs">
          <button type="button" class="tab-btn active" data-tab="WAITING">Waiting for Pickup</button>
          <button type="button" class="tab-btn" data-tab="DELIVERED">Delivered</button>
          <button type="button" class="tab-btn" data-tab="ALL">All Parcels</button>
        </div>

        <div id="parcelsContainer" class="parcels-grid">
          <div class="card" style="padding:2rem;text-align:center;color:var(--text-muted);">Loading parcels...</div>
        </div>

        <div id="paginationBar" style="display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0 0;flex-wrap:wrap;gap:0.75rem;"></div>
      </div>
    </main>
  </div>

  <!-- Bright Full-Screen QR Pickup Overlay -->
  <div id="qrFullscreen" class="qr-fullscreen-overlay">
    <div style="max-width: 400px; width: 100%;">
      <div style="font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 0.5rem;">
        Present to Warden for Pickup
      </div>
      <h2 id="qrParcelCodeTitle" style="font-size: 1.65rem; font-weight: 800; color: #0f172a; margin-bottom: 0.25rem;">PRC-2026-0001</h2>
      <p id="qrParcelSub" style="color: #475569; margin-bottom: 1.25rem; font-size: 0.95rem;"></p>

      <div class="qr-box-bright">
        <div id="qrRenderBox"></div>
        <div style="border-top: 1px dashed #cbd5e1; width: 100%; padding-top: 0.75rem;">
          <div style="font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 700;">6-Digit Pickup Code (Fallback)</div>
          <div id="qrPickupCode" style="font-size: 1.75rem; font-weight: 800; letter-spacing: 0.2em; color: #0f172a; margin-top: 0.2rem;">000000</div>
        </div>
      </div>

      <div id="qrCodNote" style="margin-top: 1rem; color: #b91c1c; font-weight: 700;"></div>

      <div style="margin-top: 1.5rem;">
        <button type="button" class="btn btn-primary" style="width: 100%;" onclick="closeQrFullscreen()">Close QR View</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/ui.js?v=3"></script>
  <script src="/js/maintenance-ui.js"></script>
  <script>
    function closeQrFullscreen() {
      document.getElementById('qrFullscreen').classList.remove('active');
    }

    (async () => {
      const user = await Auth.requireAuth(['STUDENT']);
      if (!user) return;
      UI.renderLayout(user, 'my-parcels');

      let currentTab = 'WAITING';
      let currentPage = 0;

      document.querySelectorAll('#parcelTabs .tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#parcelTabs .tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTab = btn.dataset.tab;
          loadParcels(0);
        });
      });

      async function refreshWaitingCount() {
        const res = await fetch('/api/student/parcels/waiting-count', { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('waitingCountPill').textContent = `${data.waitingCount || 0} Waiting`;
        UI.refreshParcelBadge();
      }

      async function loadParcels(page = 0) {
        currentPage = page;
        const res = await fetch(`/api/student/parcels?tab=${encodeURIComponent(currentTab)}&page=${page}&size=12`, { credentials: 'same-origin' });
        const container = document.getElementById('parcelsContainer');
        container.innerHTML = '';
        if (!res.ok) return;
        const pageData = await res.json();
        const list = pageData.content || [];

        if (list.length === 0) {
          container.appendChild(UI.createElement('div', { className: 'card', style: 'grid-column:1/-1;padding:2.5rem;text-align:center;color:var(--text-muted);' },
            'No parcels in this category.'));
        } else {
          list.forEach(p => {
            const card = UI.createElement('div', { className: 'parcel-card' });

            const top = UI.createElement('div', { style: 'display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;' },
              UI.createElement('div', {},
                UI.createElement('div', { style: 'font-weight:800;font-size:1.05rem;color:var(--text-main);' }, p.parcelCode),
                UI.createElement('div', { style: 'font-size:0.85rem;color:var(--primary);font-weight:700;' }, `${p.courierName} (${p.parcelType})`)
              ),
              UI.parcelStatusBadge(p.status)
            );

            const meta = UI.createElement('div', { style: 'font-size:0.86rem;color:var(--text-muted);display:flex;flex-direction:column;gap:0.25rem;' },
              UI.createElement('div', {}, UI.createElement('strong', {}, 'Received: '), UI.formatDateTime(p.receivedAt)),
              p.storageLocation ? UI.createElement('div', {}, UI.createElement('strong', {}, 'Shelf: '), p.storageLocation) : null,
              p.description ? UI.createElement('div', {}, UI.createElement('strong', {}, 'Notes: '), p.description) : null,
              (p.status === 'RECEIVED' || p.status === 'NOTIFIED')
                ? UI.createElement('div', {}, UI.createElement('strong', {}, 'Waiting: '), `${p.daysWaiting} day(s)`)
                : null,
              p.deliveredAt ? UI.createElement('div', { style: 'color:#15803d;font-weight:600;' }, `Delivered: ${UI.formatDateTime(p.deliveredAt)}`) : null
            );

            let codBadge = null;
            if (p.cod && p.codAmount) {
              codBadge = UI.createElement('div', {
                style: 'background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:0.45rem 0.75rem;border-radius:var(--radius-md);font-size:0.84rem;font-weight:700;'
              }, `Cash on Delivery: Rs. ${p.codAmount} (${p.codCollected ? 'Paid' : 'Payment Pending'})`);
            }

            let photoRow = null;
            if (p.attachments && p.attachments.length > 0) {
              photoRow = UI.createElement('div', { className: 'photo-thumb-grid' });
              p.attachments.forEach(att => {
                photoRow.appendChild(UI.createElement('img', {
                  src: att.url,
                  className: 'photo-thumb',
                  alt: 'Parcel photo',
                  onclick: () => window.open(att.url, '_blank')
                }));
              });
            }

            card.append(top, meta);
            if (codBadge) card.appendChild(codBadge);
            if (photoRow) card.appendChild(photoRow);

            if (p.status === 'RECEIVED' || p.status === 'NOTIFIED') {
              const btnQr = UI.createElement('button', {
                type: 'button',
                className: 'btn btn-primary',
                style: 'width:100%;margin-top:auto;',
                onclick: () => openQrView(p)
              }, 'Show QR for Pickup');
              card.appendChild(btnQr);
            }
            container.appendChild(card);
          });
        }
        MaintUI.renderPagination(document.getElementById('paginationBar'), pageData, p => loadParcels(p));
      }

      function openQrView(p) {
        document.getElementById('qrParcelCodeTitle').textContent = p.parcelCode;
        document.getElementById('qrParcelSub').textContent = `${p.courierName} — ${p.description || p.parcelType}`;
        document.getElementById('qrPickupCode').textContent = p.pickupCode || '------';
        document.getElementById('qrCodNote').textContent = p.cod && !p.codCollected
          ? `Note: Keep Rs. ${p.codAmount} ready (Cash on Delivery)` : '';

        const box = document.getElementById('qrRenderBox');
        box.innerHTML = '';
        if (typeof QRCode !== 'undefined' && p.qrToken) {
          new QRCode(box, {
            text: p.qrToken,
            width: 220,
            height: 220,
            colorDark: '#0f172a',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });
        } else {
          box.textContent = p.qrToken || p.parcelCode;
        }
        document.getElementById('qrFullscreen').classList.add('active');
      }

      await Promise.all([refreshWaitingCount(), loadParcels(0)]);
    })();
  </script>
</body>
</html>
