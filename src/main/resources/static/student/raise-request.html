<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raise Maintenance Request - PSG iTech Hostel</title>
  <link rel="icon" type="image/png" href="/img/psgitech_logo.png">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .form-grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }
    .preview-list {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }
    .preview-chip {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-light);
    }
    .preview-chip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .confirmation-box {
      display: none;
      background: #f0fdf4;
      border: 2px solid #22c55e;
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div id="app-layout" class="app-container">
    <main class="main-content">
      <div class="page-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Raise Maintenance Request</h1>
            <p class="page-subtitle">Submit a room, electrical, plumbing, carpentry, WiFi, or facility complaint.</p>
          </div>
          <div>
            <a href="/student/my-requests.html" class="btn btn-secondary btn-sm">View My Requests</a>
          </div>
        </div>

        <div id="confirmationBox" class="confirmation-box">
          <h2 style="color: #15803d; margin-bottom: 0.5rem;">Request Submitted Successfully</h2>
          <p style="margin-bottom: 0.75rem;">Your maintenance request ID is <strong id="createdReqCode" style="font-size: 1.15rem; color: #0f172a;"></strong>. The Warden has been notified.</p>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <a href="/student/my-requests.html" class="btn btn-primary btn-sm">Track in My Requests</a>
            <button type="button" class="btn btn-secondary btn-sm" id="btnRaiseAnother">Raise Another Request</button>
          </div>
        </div>

        <div class="card" id="requestFormCard">
          <div class="card-header">
            <h2 class="card-title">Complaint / Maintenance Query Details</h2>
          </div>
          <form id="raiseRequestForm">
            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label" for="categoryInput">Category *</label>
                <select id="categoryInput" class="form-control" required>
                  <option value="">-- Select Category --</option>
                  <option value="ROOM_CLEANING">Room Cleaning</option>
                  <option value="ELECTRICAL">Electrical</option>
                  <option value="PLUMBING">Plumbing</option>
                  <option value="FURNITURE_CARPENTRY">Furniture / Carpentry</option>
                  <option value="INTERNET_WIFI">Internet / WiFi</option>
                  <option value="BATHROOM_WASHROOM">Bathroom / Washroom</option>
                  <option value="OTHER">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="priorityInput">Priority *</label>
                <select id="priorityInput" class="form-control" required>
                  <option value="LOW">Low</option>
                  <option value="MEDIUM" selected>Medium</option>
                  <option value="HIGH">High</option>
                  <option value="URGENT">Urgent</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="titleInput">Request Title *</label>
              <input type="text" id="titleInput" class="form-control" maxlength="150" required placeholder="e.g. Ceiling fan regulator not working">
            </div>

            <div class="form-group">
              <label class="form-label" for="descInput">Detailed Description *</label>
              <textarea id="descInput" class="form-control" rows="4" required placeholder="Describe the issue clearly so the maintenance team can bring the right tools..."></textarea>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label" for="blockInput">Hostel / Block *</label>
                <input type="text" id="blockInput" class="form-control" maxlength="100" required placeholder="e.g. Block A">
              </div>
              <div class="form-group">
                <label class="form-label" for="roomInput">Room Number *</label>
                <input type="text" id="roomInput" class="form-control" maxlength="50" required placeholder="e.g. 101">
              </div>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label" for="slotInput">Preferred Visit Time Slot (Optional)</label>
                <select id="slotInput" class="form-control">
                  <option value="">Anytime</option>
                  <option value="Morning (9:00 AM - 12:00 PM)">Morning (9:00 AM - 12:00 PM)</option>
                  <option value="Afternoon (12:00 PM - 4:00 PM)">Afternoon (12:00 PM - 4:00 PM)</option>
                  <option value="Evening (4:00 PM - 7:00 PM)">Evening (4:00 PM - 7:00 PM)</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="photosInput">Upload Photos (Optional, max 3 images, JPG/PNG/WebP &le; 2MB each)</label>
                <input type="file" id="photosInput" class="form-control" accept="image/jpeg,image/png,image/webp" multiple>
                <div id="photoPreviewList" class="preview-list"></div>
              </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
              <button type="reset" class="btn btn-secondary">Clear</button>
              <button type="submit" id="submitBtn" class="btn btn-primary">Submit Maintenance Request</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/ui.js?v=3"></script>
  <script>
    (async () => {
      const user = await Auth.requireAuth(['STUDENT']);
      if (!user) return;
      UI.renderLayout(user, 'raise-request');

      async function loadDefaultLocation() {
        try {
          const res = await fetch('/api/student/maintenance/default-location', { credentials: 'same-origin' });
          if (res.ok) {
            const loc = await res.json();
            if (loc.hostelBlock) document.getElementById('blockInput').value = loc.hostelBlock;
            if (loc.roomNumber) document.getElementById('roomInput').value = loc.roomNumber;
          }
        } catch (e) {}
      }
      await loadDefaultLocation();

      const photosInput = document.getElementById('photosInput');
      const previewList = document.getElementById('photoPreviewList');

      photosInput.addEventListener('change', () => {
        previewList.innerHTML = '';
        const files = Array.from(photosInput.files || []);
        if (files.length > 3) {
          UI.showToast('Maximum 3 photos are allowed.', 'error');
          photosInput.value = '';
          return;
        }
        for (const f of files) {
          if (!['image/jpeg', 'image/jpg', 'image/png', 'image/webp'].includes(f.type)) {
            UI.showToast(`Invalid file type: ${f.name}. Only JPG/PNG/WebP allowed.`, 'error');
            photosInput.value = '';
            previewList.innerHTML = '';
            return;
          }
          if (f.size > 2 * 1024 * 1024) {
            UI.showToast(`${f.name} exceeds 2 MB limit.`, 'error');
            photosInput.value = '';
            previewList.innerHTML = '';
            return;
          }
          const chip = UI.createElement('div', { className: 'preview-chip' });
          const img = UI.createElement('img', { src: URL.createObjectURL(f), alt: f.name });
          chip.appendChild(img);
          previewList.appendChild(chip);
        }
      });

      document.getElementById('btnRaiseAnother').addEventListener('click', async () => {
        document.getElementById('confirmationBox').style.display = 'none';
        document.getElementById('requestFormCard').style.display = 'block';
        document.getElementById('raiseRequestForm').reset();
        previewList.innerHTML = '';
        await loadDefaultLocation();
      });

      document.getElementById('raiseRequestForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        try {
          const fd = new FormData();
          fd.append('category', document.getElementById('categoryInput').value);
          fd.append('priority', document.getElementById('priorityInput').value);
          fd.append('title', document.getElementById('titleInput').value.trim());
          fd.append('description', document.getElementById('descInput').value.trim());
          fd.append('hostelBlock', document.getElementById('blockInput').value.trim());
          fd.append('roomNumber', document.getElementById('roomInput').value.trim());
          const slot = document.getElementById('slotInput').value;
          if (slot) fd.append('preferredTimeSlot', slot);

          const files = Array.from(photosInput.files || []);
          files.forEach(f => fd.append('files', f));

          const res = await fetch('/api/student/maintenance', {
            method: 'POST',
            credentials: 'same-origin',
            body: fd
          });
          const data = await res.json();
          if (!res.ok) {
            UI.showToast(data.message || 'Failed to submit request', 'error');
          } else {
            document.getElementById('createdReqCode').textContent = data.requestCode;
            document.getElementById('confirmationBox').style.display = 'block';
            document.getElementById('requestFormCard').style.display = 'none';
            UI.showToast(`Request ${data.requestCode} submitted!`, 'success');
            UI.refreshUnreadCount();
          }
        } catch (err) {
          UI.showToast('Network error submitting request', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Maintenance Request';
        }
      });
    })();
  </script>
</body>
</html>
