<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Attendance - PSG iTech Hostel</title>
  <link rel="icon" type="image/png" href="/img/psgitech_logo.png">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .session-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .session-card {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .stats-grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .mini-stat {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
    }
    .mini-stat-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .mini-stat-val {
      font-size: 1.65rem;
      font-weight: 800;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div id="app-layout" class="app-container">
    <main class="main-content">
      <div class="page-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Digital Attendance</h1>
            <p class="page-subtitle">Mark daily hostel attendance inside the active window and view your attendance record.</p>
          </div>
          <div>
            <span id="serverClockBadge" class="status-badge" style="background: #f1f5f9; color: #334155;">Server Time: --:--</span>
          </div>
        </div>

        <!-- Outpass Lock Banner (when locked) -->
        <div id="lockBannerArea"></div>

        <!-- Today's Sessions -->
        <div id="todaySessionsGrid" class="session-cards-grid">
          <div class="card" style="padding: 2rem; text-align: center; color: var(--text-muted);">Loading today's attendance sessions...</div>
        </div>

        <!-- Summary Metrics -->
        <div class="stats-grid-4">
          <div class="mini-stat" style="border-left: 4px solid #0284c7;">
            <div class="mini-stat-label">Total Sessions</div>
            <div class="mini-stat-val" id="sumTotal">0</div>
          </div>
          <div class="mini-stat" style="border-left: 4px solid #16a34a;">
            <div class="mini-stat-label">Marked</div>
            <div class="mini-stat-val" style="color: #15803d;" id="sumMarked">0</div>
          </div>
          <div class="mini-stat" style="border-left: 4px solid #dc2626;">
            <div class="mini-stat-label">Missed</div>
            <div class="mini-stat-val" style="color: #b91c1c;" id="sumMissed">0</div>
          </div>
          <div class="mini-stat" style="border-left: 4px solid #6366f1;">
            <div class="mini-stat-label">Attendance Rate</div>
            <div class="mini-stat-val" id="sumPct">100%</div>
          </div>
        </div>

        <!-- History Table -->
        <div class="card">
          <div class="card-header" style="flex-wrap: wrap; gap: 0.75rem;">
            <h2 class="card-title">Attendance History</h2>
            <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
              <input type="month" id="monthFilter" class="form-control" style="width: 170px;">
              <button type="button" class="btn btn-secondary btn-sm" id="btnAllMonths">All Months</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="data-table mobile-collapse-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Session</th>
                  <th>Status</th>
                  <th>Marked At</th>
                  <th>Remarks</th>
                </tr>
              </thead>
              <tbody id="historyBody">
                <tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-muted);">Loading history...</td></tr>
              </tbody>
            </table>
          </div>
          <div id="paginationBar" style="display:flex;justify-content:space-between;align-items:center;padding:1rem 0 0;flex-wrap:wrap;gap:0.75rem;"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/ui.js?v=3"></script>
  <script src="/js/maintenance-ui.js"></script>
  <script>
    (async () => {
      const user = await Auth.requireAuth(['STUDENT']);
      if (!user) return;
      UI.renderLayout(user, 'attendance');

      let serverOffsetMs = 0;
      let countdownTimers = [];
      let currentPage = 0;

      function formatCountdown(secs) {
        if (secs <= 0) return '00:00:00';
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
      }

      function clearTimers() {
        countdownTimers.forEach(t => clearInterval(t));
        countdownTimers = [];
      }

      async function loadToday() {
        clearTimers();
        const res = await fetch('/api/student/digital-attendance/today', { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();

        const srvTime = new Date(data.serverTime);
        serverOffsetMs = srvTime.getTime() - Date.now();
        document.getElementById('serverClockBadge').textContent =
          'Server Time: ' + srvTime.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

        // Outpass Lock Banner
        const lockArea = document.getElementById('lockBannerArea');
        lockArea.innerHTML = '';
        if (data.outpassLocked) {
          const banner = UI.createElement('div', { className: 'lock-alert-banner' },
            UI.createElement('span', { style: 'font-size:1.75rem;' }, '🔒'),
            UI.createElement('div', {},
              UI.createElement('div', { style: 'font-weight:800;font-size:1.05rem;' }, 'OUTPASS LOCKED — MISSED ATTENDANCE'),
              UI.createElement('div', { style: 'font-size:0.92rem;margin-top:0.25rem;' },
                `${data.lockReason || 'Outpass privileges are locked due to missed attendance.'} Please contact the Warden to unlock.`),
              data.lockedAt
                ? UI.createElement('div', { style: 'font-size:0.8rem;margin-top:0.25rem;' }, `Locked at: ${UI.formatDateTime(data.lockedAt)}`)
                : null
            )
          );
          lockArea.appendChild(banner);
        }

        const grid = document.getElementById('todaySessionsGrid');
        grid.innerHTML = '';
        const sessions = data.sessions || [];
        if (sessions.length === 0) {
          grid.appendChild(UI.createElement('div', { className: 'card', style: 'padding:2rem;text-align:center;color:var(--text-muted);' },
            'No active attendance sessions scheduled for today.'));
          return;
        }

        sessions.forEach(s => {
          const card = UI.createElement('div', { className: 'session-card' });

          const header = UI.createElement('div', { style: 'display:flex;justify-content:space-between;align-items:flex-start;gap:0.75rem;' },
            UI.createElement('div', {},
              UI.createElement('h2', { style: 'font-size:1.25rem;margin-bottom:0.2rem;' }, s.sessionName),
              UI.createElement('div', { style: 'font-size:0.86rem;color:var(--text-muted);' },
                `Window: ${s.startTime.slice(0, 5)} – ${s.endTime.slice(0, 5)} (${s.hostelBlock})`)
            ),
            UI.digitalAttendanceBadge(s.status)
          );

          const metaRow = UI.createElement('div', { style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;' });
          const countdownEl = UI.createElement('span', { className: 'countdown-pill' },
            s.windowOpen ? `Closes in ${formatCountdown(s.secondsUntilDeadline)}`
              : (s.beforeStart ? `Opens at ${s.startTime.slice(0, 5)}` : 'Deadline Passed'));
          metaRow.appendChild(countdownEl);

          if (s.geofenceEnabled) {
            metaRow.appendChild(UI.createElement('span', {
              className: 'status-badge',
              style: 'background:#e0f2fe;color:#0369a1;'
            }, `GPS Geofence (${s.geofenceRadiusMeters}m)`));
          }

          if (s.windowOpen && s.status === 'PENDING') {
            let rem = s.secondsUntilDeadline;
            const timer = setInterval(() => {
              rem--;
              if (rem <= 0) {
                clearInterval(timer);
                loadToday();
              } else {
                countdownEl.textContent = `Closes in ${formatCountdown(rem)}`;
              }
            }, 1000);
            countdownTimers.push(timer);
          }

          let infoBox = null;
          if (s.status === 'MARKED' || s.status === 'MANUAL_PRESENT') {
            infoBox = UI.createElement('div', {
              style: 'background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;padding:0.75rem 1rem;border-radius:var(--radius-md);font-size:0.9rem;font-weight:600;'
            }, `Marked at: ${UI.formatDateTime(s.markedAt)}`);
          } else if (s.status === 'ON_OUTPASS') {
            infoBox = UI.createElement('div', {
              style: 'background:#f5f3ff;border:1px solid #ddd6fe;color:#6d28d9;padding:0.75rem 1rem;border-radius:var(--radius-md);font-size:0.9rem;'
            }, 'Automatically excluded — You have an active Approved Outpass.');
          } else if (s.status === 'MISSED') {
            infoBox = UI.createElement('div', {
              style: 'background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:0.75rem 1rem;border-radius:var(--radius-md);font-size:0.9rem;font-weight:600;'
            }, 'Not Pressed before deadline. Contact the Warden.');
          }

          const btnMark = UI.createElement('button', {
            type: 'button',
            className: 'btn-mark-attendance',
            onclick: () => handleMarkAttendance(s, btnMark)
          }, s.status === 'MARKED' ? 'Attendance Marked' : (s.windowOpen && s.status === 'PENDING' ? 'Mark Attendance Now' : 'Window Closed'));

          btnMark.disabled = !(s.windowOpen && s.status === 'PENDING');

          card.append(header, metaRow);
          if (infoBox) card.appendChild(infoBox);
          card.appendChild(btnMark);
          grid.appendChild(card);
        });
      }

      async function getGeoCoordinates() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error('Geolocation is not supported by your browser'));
            return;
          }
          navigator.geolocation.getCurrentPosition(
            pos => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
            err => reject(new Error('Unable to access device location: ' + err.message)),
            { enableHighAccuracy: true, timeout: 10000 }
          );
        });
      }

      async function handleMarkAttendance(session, btn) {
        btn.disabled = true;
        const origText = btn.textContent;
        btn.textContent = session.geofenceEnabled ? 'Verifying Location...' : 'Marking Attendance...';

        try {
          let latitude = null;
          let longitude = null;
          if (session.geofenceEnabled) {
            const coords = await getGeoCoordinates();
            latitude = coords.latitude;
            longitude = coords.longitude;
          }

          const res = await fetch('/api/student/digital-attendance/mark', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ sessionId: session.sessionId, latitude, longitude })
          });
          const data = await res.json();
          if (!res.ok) {
            UI.showToast(data.message || 'Failed to mark attendance', 'error');
            btn.disabled = false;
            btn.textContent = origText;
          } else {
            UI.showToast('Attendance marked successfully!', 'success');
            await Promise.all([loadToday(), loadHistory(0)]);
          }
        } catch (err) {
          UI.showToast(err.message || 'Could not mark attendance', 'error');
          btn.disabled = false;
          btn.textContent = origText;
        }
      }

      async function loadHistory(page = 0) {
        currentPage = page;
        const params = new URLSearchParams({ page, size: 10 });
        const monthVal = document.getElementById('monthFilter').value;
        if (monthVal) {
          const [y, m] = monthVal.split('-');
          params.append('year', y);
          params.append('month', parseInt(m, 10));
        }

        const res = await fetch(`/api/student/digital-attendance/history?${params.toString()}`, { credentials: 'same-origin' });
        if (!res.ok) return;
        const h = await res.json();

        document.getElementById('sumTotal').textContent = h.totalSessions;
        document.getElementById('sumMarked').textContent = h.markedCount;
        document.getElementById('sumMissed').textContent = h.missedCount;
        document.getElementById('sumPct').textContent = `${h.attendancePercentage}%`;

        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = '';
        if (!h.items || h.items.length === 0) {
          tbody.appendChild(UI.createElement('tr', {}, UI.createElement('td', { colSpan: 5, style: 'text-align:center;padding:2rem;color:var(--text-muted);' }, 'No attendance records found.')));
        } else {
          h.items.forEach(item => {
            tbody.appendChild(UI.createElement('tr', {},
              UI.createElement('td', { dataset: { label: 'Date' } }, UI.formatDate(item.date)),
              UI.createElement('td', { dataset: { label: 'Session' } }, item.sessionName),
              UI.createElement('td', { dataset: { label: 'Status' } }, UI.digitalAttendanceBadge(item.status)),
              UI.createElement('td', { dataset: { label: 'Marked At' }, style: 'font-size:0.84rem;' }, UI.formatDateTime(item.markedAt)),
              UI.createElement('td', { dataset: { label: 'Remarks' }, style: 'font-size:0.84rem;color:var(--text-muted);' }, item.remarks || '—')
            ));
          });
        }
        MaintUI.renderPagination(document.getElementById('paginationBar'), {
          number: h.currentPage,
          totalPages: h.totalPages,
          totalElements: h.totalElements,
          numberOfElements: h.items.length,
          first: h.currentPage === 0,
          last: h.currentPage >= h.totalPages - 1
        }, p => loadHistory(p));
      }

      document.getElementById('monthFilter').addEventListener('change', () => loadHistory(0));
      document.getElementById('btnAllMonths').addEventListener('click', () => {
        document.getElementById('monthFilter').value = '';
        loadHistory(0);
      });

      await Promise.all([loadToday(), loadHistory(0)]);
    })();
  </script>
</body>
</html>
