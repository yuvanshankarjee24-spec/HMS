<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mess Token Booking - PSG iTech Hostel</title>
  <link rel="icon" type="image/png" href="/img/psgitech_logo.png">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .menu-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }
    .food-card { background:#fff; border:1px solid var(--border-light); border-radius:var(--radius-lg); padding:1.15rem; display:flex; flex-direction:column; gap:0.65rem; }
    .order-bar { position:sticky; bottom:1rem; background:#0f172a; color:#fff; border-radius:var(--radius-lg); padding:1rem 1.35rem; margin-top:1.5rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; box-shadow:0 12px 30px rgba(15,23,42,0.25); }
  </style>
</head>
<body>
  <div id="app-layout" class="app-container">
    <main class="main-content">
      <div class="page-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Mess Token Booking</h1>
            <p class="page-subtitle">Choose date and meal period, select dishes &amp; quantities, and book your QR food token.</p>
          </div>
          <div>
            <a href="/student/my-tokens.html" class="btn btn-secondary btn-sm">My Tokens</a>
          </div>
        </div>

        <div class="card" style="padding:1.25rem;margin-bottom:1.25rem;">
          <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:end;">
            <div>
              <label class="form-label">Meal Date</label>
              <input type="date" id="mealDate" class="form-control" style="width:170px;">
            </div>
            <div>
              <label class="form-label">Meal Period</label>
              <select id="mealPeriod" class="form-control" style="width:180px;">
                <option value="BREAKFAST">Breakfast</option>
                <option value="LUNCH" selected>Lunch</option>
                <option value="SNACKS">Snacks</option>
                <option value="DINNER">Dinner</option>
              </select>
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="btnLoadMenu">Show Menu</button>
          </div>
        </div>

        <div id="menuGrid" class="menu-grid"></div>

        <div id="orderBar" class="order-bar" style="display:none;">
          <div>
            <div style="font-size:0.8rem;opacity:0.8;" id="orderItemsSummary">0 items selected</div>
            <div style="font-size:1.35rem;font-weight:800;" id="orderTotalText">Total: Rs. 0.00</div>
          </div>
          <button type="button" class="btn btn-success" id="btnBookToken">Book Token Now</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/ui.js?v=3"></script>
  <script>
    (async () => {
      const user = await Auth.requireAuth(['STUDENT']);
      if (!user) return;
      UI.renderLayout(user, 'mess-booking');

      const todayStr = new Date().toISOString().slice(0, 10);
      const dateInput = document.getElementById('mealDate');
      dateInput.value = todayStr;
      dateInput.min = todayStr;

      let currentMenu = [];
      let cart = {}; // scheduleId -> qty

      function updateSummary() {
        let totalQty = 0;
        let totalAmt = 0;
        const names = [];
        currentMenu.forEach(m => {
          const q = cart[m.id] || 0;
          if (q > 0) {
            totalQty += q;
            totalAmt += q * Number(m.price || 0);
            names.push(`${m.foodName} x${q}`);
          }
        });
        const bar = document.getElementById('orderBar');
        bar.style.display = totalQty > 0 ? 'flex' : 'none';
        document.getElementById('orderItemsSummary').textContent = names.join(', ');
        document.getElementById('orderTotalText').textContent = `Total: Rs. ${totalAmt.toFixed(2)}`;
      }

      async function loadMenu() {
        cart = {};
        updateSummary();
        const d = dateInput.value;
        const p = document.getElementById('mealPeriod').value;
        const res = await fetch(`/api/student/mess/menu?date=${d}&period=${p}`, { credentials: 'same-origin' });
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = '';
        if (!res.ok) return;
        currentMenu = await res.json();

        if (currentMenu.length === 0) {
          grid.appendChild(UI.createElement('div', { className: 'card', style: 'grid-column:1/-1;padding:2rem;text-align:center;color:var(--text-muted);' },
            'No menu items scheduled for this date & period yet.'));
          return;
        }

        currentMenu.forEach(m => {
          const card = UI.createElement('div', { className: 'food-card' });
          const catBadge = UI.createElement('span', { className: `status-badge badge-food-${m.category.toLowerCase()}` }, m.category.replace('_', ' '));

          const qtyText = UI.createElement('span', {}, '0');
          const btnMinus = UI.createElement('button', {
            type: 'button',
            onclick: () => {
              const cur = cart[m.id] || 0;
              if (cur > 0) {
                cart[m.id] = cur - 1;
                qtyText.textContent = String(cart[m.id]);
                updateSummary();
              }
            }
          }, '-');
          const btnPlus = UI.createElement('button', {
            type: 'button',
            onclick: () => {
              const cur = cart[m.id] || 0;
              const limit = Math.min(m.maxPerStudent, m.remainingStock);
              if (cur < limit) {
                cart[m.id] = cur + 1;
                qtyText.textContent = String(cart[m.id]);
                updateSummary();
              } else {
                UI.showToast(`Max ${limit} allowed / available`, 'info');
              }
            }
          }, '+');
          btnMinus.disabled = !m.bookingOpen;
          btnPlus.disabled = !m.bookingOpen;

          const stepper = UI.createElement('div', { className: 'qty-stepper' }, btnMinus, qtyText, btnPlus);

          card.append(
            m.photoUrl ? UI.createElement('img', { src: m.photoUrl, style: 'width:100%;height:130px;object-fit:cover;border-radius:var(--radius-md);' }) : null,
            UI.createElement('div', { style: 'display:flex;justify-content:space-between;align-items:center;' },
              UI.createElement('strong', { style: 'font-size:1.05rem;' }, m.foodName),
              catBadge
            ),
            UI.createElement('div', { style: 'display:flex;justify-content:space-between;font-size:0.88rem;color:var(--text-muted);' },
              UI.createElement('span', {}, `Rs. ${Number(m.price).toFixed(2)}`),
              UI.createElement('span', {}, `Stock: ${m.remainingStock}/${m.dailyStock} (Max ${m.maxPerStudent})`)
            ),
            UI.createElement('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-top:auto;' },
              m.bookingOpen
                ? UI.createElement('span', { style: 'font-size:0.8rem;color:#15803d;font-weight:700;' }, 'Open for Booking')
                : UI.createElement('span', { style: 'font-size:0.8rem;color:#b91c1c;font-weight:700;' }, m.bookingMessage),
              stepper
            )
          );
          grid.appendChild(card);
        });
      }

      document.getElementById('btnBookToken').addEventListener('click', async () => {
        const items = Object.entries(cart)
          .filter(([, q]) => q > 0)
          .map(([id, q]) => ({ menuScheduleId: Number(id), quantity: q }));
        if (items.length === 0) return;

        const res = await fetch('/api/student/mess/book', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            menuDate: dateInput.value,
            period: document.getElementById('mealPeriod').value,
            items
          })
        });
        const data = await res.json();
        if (!res.ok) {
          UI.showToast(data.message || 'Booking failed', 'error');
        } else {
          UI.showToast(`Booked ${data.tokenCode}!`, 'success');
          window.location.href = '/student/my-tokens.html';
        }
      });

      document.getElementById('btnLoadMenu').addEventListener('click', loadMenu);
      dateInput.addEventListener('change', loadMenu);
      document.getElementById('mealPeriod').addEventListener('change', loadMenu);
      await loadMenu();
    })();
  </script>
</body>
</html>
