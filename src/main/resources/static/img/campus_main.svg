<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fc4fd"/>
      <stop offset="60%" stop-color="#bfe2fe"/>
      <stop offset="100%" stop-color="#eaf5ff"/>
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0e233d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e90ff"/>
      <stop offset="100%" stop-color="#0c63c4"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e90ff"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="600" height="600" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="480" cy="120" r="45" fill="#fef08a" opacity="0.8"/>
  <circle cx="480" cy="120" r="60" fill="#fef08a" opacity="0.3"/>

  <!-- Clouds -->
  <path d="M100 130 q20 -25 45 -10 q25 -20 50 0 q25 0 25 20 l-120 0 z" fill="#ffffff" opacity="0.7"/>
  <path d="M340 180 q15 -18 35 -7 q18 -15 38 0 q18 0 18 15 l-91 0 z" fill="#ffffff" opacity="0.6"/>

  <!-- Background hills/campus grounds -->
  <path d="M0 450 Q 150 420 300 450 T 600 440 L 600 600 L 0 600 Z" fill="#93c5fd" opacity="0.4"/>
  <path d="M0 470 Q 200 450 400 480 T 600 460 L 600 600 L 0 600 Z" fill="url(#grassGrad)" opacity="0.7"/>

  <!-- Campus Main Academic / Hostel Complex -->
  <!-- Wing Left -->
  <rect x="80" y="270" width="130" height="190" rx="8" fill="url(#bldgGrad)"/>
  <!-- Windows Wing Left -->
  <g fill="#93c5fd" opacity="0.8">
    <rect x="95" y="290" width="20" height="25" rx="3"/>
    <rect x="125" y="290" width="20" height="25" rx="3"/>
    <rect x="155" y="290" width="20" height="25" rx="3"/>
    <rect x="180" y="290" width="15" height="25" rx="3"/>

    <rect x="95" y="330" width="20" height="25" rx="3"/>
    <rect x="125" y="330" width="20" height="25" rx="3"/>
    <rect x="155" y="330" width="20" height="25" rx="3"/>
    <rect x="180" y="330" width="15" height="25" rx="3"/>

    <rect x="95" y="370" width="20" height="25" rx="3"/>
    <rect x="125" y="370" width="20" height="25" rx="3"/>
    <rect x="155" y="370" width="20" height="25" rx="3"/>
    <rect x="180" y="370" width="15" height="25" rx="3"/>
  </g>

  <!-- Wing Right -->
  <rect x="390" y="270" width="130" height="190" rx="8" fill="url(#bldgGrad)"/>
  <!-- Windows Wing Right -->
  <g fill="#93c5fd" opacity="0.8">
    <rect x="405" y="290" width="20" height="25" rx="3"/>
    <rect x="435" y="290" width="20" height="25" rx="3"/>
    <rect x="465" y="290" width="20" height="25" rx="3"/>
    <rect x="490" y="290" width="15" height="25" rx="3"/>

    <rect x="405" y="330" width="20" height="25" rx="3"/>
    <rect x="435" y="330" width="20" height="25" rx="3"/>
    <rect x="465" y="330" width="20" height="25" rx="3"/>
    <rect x="490" y="330" width="15" height="25" rx="3"/>

    <rect x="405" y="370" width="20" height="25" rx="3"/>
    <rect x="435" y="370" width="20" height="25" rx="3"/>
    <rect x="465" y="370" width="20" height="25" rx="3"/>
    <rect x="490" y="370" width="15" height="25" rx="3"/>
  </g>

  <!-- Central Tower / Clock Tower -->
  <rect x="195" y="200" width="210" height="260" rx="10" fill="#152e4d"/>
  <rect x="220" y="160" width="160" height="50" rx="6" fill="url(#accentGrad)"/>
  
  <!-- Central Dome / Roof -->
  <path d="M 220 160 Q 300 100 380 160 Z" fill="#0e4b8a"/>
  <rect x="296" y="75" width="8" height="35" fill="#f8fafc"/>
  <polygon points="300,65 315,75 300,85" fill="#1e90ff"/>

  <!-- Clock -->
  <circle cx="300" cy="225" r="24" fill="#ffffff" stroke="#1e90ff" stroke-width="4"/>
  <line x1="300" y1="225" x2="300" y2="212" stroke="#0e233d" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="225" x2="310" y2="225" stroke="#0e233d" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Entrance Columns -->
  <rect x="240" y="370" width="120" height="90" rx="4" fill="#1a3b63"/>
  <rect x="250" y="380" width="14" height="80" fill="#ffffff" opacity="0.9"/>
  <rect x="275" y="380" width="14" height="80" fill="#ffffff" opacity="0.9"/>
  <rect x="310" y="380" width="14" height="80" fill="#ffffff" opacity="0.9"/>
  <rect x="335" y="380" width="14" height="80" fill="#ffffff" opacity="0.9"/>
  
  <!-- Campus Pathway -->
  <polygon points="260,460 340,460 410,600 190,600" fill="#cbd5e1" opacity="0.9"/>
  <line x1="300" y1="460" x2="300" y2="600" stroke="#94a3b8" stroke-dasharray="8 8" stroke-width="2"/>

  <!-- Campus Trees & Lawn -->
  <circle cx="70" cy="460" r="35" fill="#10b981"/>
  <circle cx="530" cy="460" r="35" fill="#10b981"/>
  <circle cx="560" cy="480" r="30" fill="#059669"/>
  <circle cx="45" cy="485" r="28" fill="#059669"/>

  <text x="300" y="550" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f2b48" text-anchor="middle" letter-spacing="2">COLLEGE CAMPUS</text>
</svg>
