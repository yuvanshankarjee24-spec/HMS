<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Hostel Management</title>
  <link rel="icon" type="image/png" href="/img/psgitech_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-green: #1F4D3A;
      --brand-green-hover: #2d6a4f;
      --brand-green-light: #f4f8f5;
      --brand-blue: #5B7CFA;
      --brand-blue-hover: #4869e6;
      --border: #e2e8f0;
      --border-input: #d1d5db;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #64748b;
      --text-error: #dc2626;
      --font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: var(--text-primary);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    /* Centered Two-Column Login Card */
    .login-card-container {
      width: 100%;
      max-width: 960px;
      min-height: 560px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.07), 0 2px 10px rgba(15, 23, 42, 0.04);
      border: 1px solid #f1f5f9;
      display: grid;
      grid-template-columns: 48% 52%;
      overflow: hidden;
    }

    /* Left Column: Hero Image Panel */
    .login-hero-panel {
      padding: 0.85rem;
      display: flex;
      height: 100%;
      min-height: 540px;
      position: relative;
    }

    .hero-image-wrapper {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      background: #e8590c;
    }

    .hero-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 18px;
      display: block;
    }

    /* Right Column: Form Panel */
    .login-form-panel {
      padding: 2.75rem 3rem 2.5rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Top Bar: PSG iTech Logo */
    .form-header-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 1.75rem;
    }

    .header-logo {
      width: 100px;
      height: auto;
      object-fit: contain;
    }

    /* Inner Form Content Container (max-width ~400px) */
    .form-content-wrap {
      max-width: 400px;
      width: 100%;
      margin: 0 auto 0 0;
    }

    /* Heading & Role Subtitle */
    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }

    .role-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .change-role-link {
      color: var(--brand-blue);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease, text-decoration 0.2s ease;
    }

    .change-role-link:hover {
      text-decoration: underline;
      color: var(--brand-blue-hover);
    }

    .change-role-link:focus-visible {
      outline: 2px solid var(--brand-blue);
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* Inline Error Container with Zero Layout Jump */
    .error-container {
      min-height: 24px;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
    }

    .error-text {
      color: var(--text-error);
      font-size: 13px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 0.4rem;
    }

    .error-text.active {
      display: flex;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1.15rem;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.45rem;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pill-input {
      width: 100%;
      height: 46px;
      border-radius: 9999px;
      border: 1.5px solid var(--border-input);
      padding: 0 1.25rem;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .pill-input.has-toggle {
      padding-right: 2.85rem;
    }

    .pill-input::placeholder {
      color: #94a3b8;
    }

    .pill-input:focus {
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.18);
    }

    /* Show / Hide Password Eye Toggle */
    .password-toggle-btn {
      position: absolute;
      right: 1rem;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem;
      border-radius: 50%;
      outline: none;
      transition: color 0.2s ease;
    }

    .password-toggle-btn:hover {
      color: #475569;
    }

    .password-toggle-btn:focus-visible {
      outline: 2px solid var(--brand-blue);
      outline-offset: 2px;
      color: var(--brand-blue);
    }

    /* Options Row: Remember Me & Forgot Password */
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.25rem;
      margin-bottom: 1.5rem;
      font-size: 13px;
    }

    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }

    /* Round Checkbox */
    .round-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      border: 1.5px solid #cbd5e1;
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: all 0.2s ease;
      background-color: #ffffff;
    }

    .round-checkbox:checked {
      background-color: var(--brand-blue);
      border-color: var(--brand-blue);
    }

    .round-checkbox:checked::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #ffffff;
    }

    .round-checkbox:focus-visible {
      box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.25);
    }

    .forgot-password-link {
      color: var(--brand-blue);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .forgot-password-link:hover {
      text-decoration: underline;
      color: var(--brand-blue-hover);
    }

    .forgot-password-link:focus-visible {
      outline: 2px solid var(--brand-blue);
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* Full-Width Pill Login Button */
    .login-btn-pill {
      width: 100%;
      height: 46px;
      border-radius: 9999px;
      background-color: var(--brand-blue);
      color: #ffffff;
      border: none;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px rgba(91, 124, 250, 0.3);
      transition: background-color 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
      outline: none;
    }

    .login-btn-pill:hover:not(:disabled) {
      background-color: var(--brand-blue-hover);
      transform: translateY(-1px);
    }

    .login-btn-pill:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .login-btn-pill:focus-visible {
      outline: 3px solid rgba(91, 124, 250, 0.45);
      outline-offset: 3px;
    }

    /* Spinner */
    .btn-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Divider */
    .login-divider {
      border: none;
      border-top: 1px solid #f1f5f9;
      margin: 1.5rem 0 1rem 0;
    }

    /* Collapsible Dev Credentials for local testing */
    .dev-credentials-details {
      margin-top: 0.5rem;
      font-size: 12px;
      color: var(--text-muted);
    }

    .dev-credentials-summary {
      cursor: pointer;
      user-select: none;
      font-weight: 500;
      color: #64748b;
      padding: 0.2rem 0;
      transition: color 0.2s ease;
    }

    .dev-credentials-summary:hover {
      color: var(--brand-blue);
    }

    .dev-credentials-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
      margin-top: 0.5rem;
      padding: 0.5rem;
      background-color: #f8fafc;
      border-radius: 8px;
      border: 1px dashed #cbd5e1;
    }

    .dev-cred-btn {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.35rem 0.5rem;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      color: #334155;
      transition: all 0.15s ease;
    }

    .dev-cred-btn:hover {
      border-color: var(--brand-blue);
      color: var(--brand-blue);
      background-color: #f0f4ff;
    }

    /* Responsive Media Queries */
    @media (max-width: 900px) {
      .login-card-container {
        max-width: 720px;
      }
      .login-form-panel {
        padding: 2rem 2rem;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem 0.75rem;
      }
      .login-card-container {
        grid-template-columns: 1fr;
        max-width: 440px;
        min-height: auto;
        border-radius: 18px;
      }
      .login-hero-panel {
        display: block;
        height: 160px;
        min-height: 160px;
        padding: 0.75rem 0.75rem 0 0.75rem;
      }
      .hero-image-wrapper {
        border-radius: 14px;
        height: 160px;
      }
      .hero-image-wrapper img {
        border-radius: 14px;
        object-position: center 32%;
      }
      .login-form-panel {
        padding: 1.5rem 1.5rem 1.75rem 1.5rem;
      }
      .form-header-bar {
        justify-content: flex-start;
        margin-bottom: 1rem;
      }
      .header-logo {
        width: 85px;
      }
      .form-content-wrap {
        max-width: 100%;
      }
    }

    @media (max-width: 480px), (max-height: 650px) {
      .login-hero-panel {
        display: none;
      }
      .login-card-container {
        border-radius: 16px;
      }
    }

    @media (max-width: 400px) {
      .login-form-panel {
        padding: 1.75rem 1.25rem;
      }
      .login-title {
        font-size: 24px;
      }
      .pill-input {
        font-size: 16px; /* Prevents auto-zoom on mobile iOS */
      }
    }
  </style>
</head>
<body>

  <div class="login-card-container">
    <!-- Left Column: Hero Image Panel -->
    <div class="login-hero-panel">
      <div class="hero-image-wrapper">
        <img 
          src="/img/login-hero.jpg" 
          alt="Student relaxing on a bean bag using a phone" 
          loading="eager" 
          decoding="async"
        >
      </div>
    </div>

    <!-- Right Column: Form Panel -->
    <div class="login-form-panel">
      <!-- Top Bar: PSG iTech Logo -->
      <div class="form-header-bar">
        <img src="/img/psgitech_logo.png" alt="PSG iTech Logo" class="header-logo">
      </div>

      <div class="form-content-wrap">
        <h1 class="login-title">Login</h1>
        <div class="role-subtitle">
          <span id="roleSubtitleText">Student login</span>
          <span>&bull;</span>
          <a href="/" class="change-role-link">Change role</a>
        </div>

        <!-- Inline Error Banner with Zero Layout Shift -->
        <div class="error-container" id="errorContainer" aria-live="polite">
          <div class="error-text" id="errorText">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="errorMessage">Invalid username or password</span>
          </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
          <!-- Username / Identifier -->
          <div class="form-group">
            <label class="form-label" for="identifierInput">Username</label>
            <div class="input-wrap">
              <input 
                type="text" 
                id="identifierInput" 
                class="pill-input" 
                placeholder="Enter Username" 
                required 
                autofocus 
                autocomplete="username"
              >
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="passwordInput">Password</label>
            <div class="input-wrap">
              <input 
                type="password" 
                id="passwordInput" 
                class="pill-input has-toggle" 
                placeholder="Enter your password" 
                required 
                autocomplete="current-password"
              >
              <button 
                type="button" 
                id="togglePasswordBtn" 
                class="password-toggle-btn" 
                aria-label="Toggle password visibility"
                title="Toggle password visibility"
              >
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password Row -->
          <div class="options-row">
            <label class="remember-label" for="rememberMeCheckbox">
              <input type="checkbox" id="rememberMeCheckbox" class="round-checkbox">
              <span>Remember me</span>
            </label>
            <a href="#" id="forgotPasswordLink" class="forgot-password-link">forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submitBtn" class="login-btn-pill" disabled>
            <span id="btnText">Login</span>
            <span id="btnSpinner" class="btn-spinner" style="display: none;"></span>
          </button>
        </form>

        <!-- Thin Grey Divider -->
        <hr class="login-divider">

        <!-- Collapsible Dev Credentials for local environment -->
        <details class="dev-credentials-details" id="devCredentialsBox" style="display: none;">
          <summary class="dev-credentials-summary">Dev credentials</summary>
          <div class="dev-credentials-list">
            <button type="button" class="dev-cred-btn" onclick="fillDevCredentials('student', 'REG202609', 'Hostel@123')">🎓 Student: REG202609</button>
            <button type="button" class="dev-cred-btn" onclick="fillDevCredentials('warden', 'warden@hostel.edu', 'Hostel@123')">🏢 Warden: warden@hostel.edu</button>
            <button type="button" class="dev-cred-btn" onclick="fillDevCredentials('admin', 'admin@hostel.edu', 'Hostel@123')">⚙️ Admin: admin@hostel.edu</button>
            <button type="button" class="dev-cred-btn" onclick="fillDevCredentials('security', 'security@hostel.edu', 'Hostel@123')">🛡️ Security: security@hostel.edu</button>
            <button type="button" class="dev-cred-btn" onclick="fillDevCredentials('worker', 'electrician.worker@hostel.edu', 'Hostel@123')">🔧 Worker: electrician.worker</button>
          </div>
        </details>
      </div>

      <!-- Blank placeholder for bottom balance -->
      <div></div>
    </div>
  </div>

  <script src="/js/auth.js?v=6"></script>
  <script src="/js/ui.js?v=6"></script>
  <script>
    // Supported Roles Configuration
    const ROLES = {
      student: { code: 'STUDENT', label: 'Student login' },
      warden: { code: 'WARDEN', label: 'Warden login' },
      security: { code: 'SECURITY', label: 'Security login' },
      staff: { code: 'STAFF', label: 'Staff login' },
      worker: { code: 'WORKER', label: 'Worker login' },
      admin: { code: 'ADMIN', label: 'Admin login' }
    };

    let currentRoleKey = 'student';

    // Elements
    const identifierInput = document.getElementById('identifierInput');
    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');
    const rememberMeCheckbox = document.getElementById('rememberMeCheckbox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorText = document.getElementById('errorText');
    const errorMessage = document.getElementById('errorMessage');
    const roleSubtitleText = document.getElementById('roleSubtitleText');
    const loginForm = document.getElementById('loginForm');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');

    // Initialize Role State from URL or localStorage
    function initRoleState() {
      const urlParams = new URLSearchParams(window.location.search);
      let roleParam = urlParams.get('role');

      if (!roleParam) {
        try {
          roleParam = localStorage.getItem('hms_selected_role');
        } catch (e) {}
      }

      if (roleParam) {
        const clean = roleParam.toLowerCase().trim();
        if (ROLES[clean]) {
          currentRoleKey = clean;
        }
      }

      const roleInfo = ROLES[currentRoleKey];
      roleSubtitleText.textContent = roleInfo.label;
      document.title = roleInfo.label + ' - Smart Hostel Management';

      try {
        localStorage.setItem('hms_selected_role', currentRoleKey);
      } catch (e) {}
    }

    // Toggle Button Enabled State when both inputs have text
    function updateButtonState() {
      const hasIdentifier = identifierInput.value.trim().length > 0;
      const hasPassword = passwordInput.value.length > 0;
      submitBtn.disabled = !(hasIdentifier && hasPassword);
    }

    identifierInput.addEventListener('input', () => {
      hideError();
      updateButtonState();
    });

    passwordInput.addEventListener('input', () => {
      hideError();
      updateButtonState();
    });

    // Password Visibility Toggle
    let isPasswordVisible = false;
    function togglePassword() {
      isPasswordVisible = !isPasswordVisible;
      passwordInput.type = isPasswordVisible ? 'text' : 'password';
      eyeIcon.innerHTML = isPasswordVisible
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }

    togglePasswordBtn.addEventListener('click', togglePassword);
    togglePasswordBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        togglePassword();
      }
    });

    // Error Display Helpers (No Layout Jump)
    function showError(msg) {
      errorMessage.textContent = msg || 'Invalid username or password';
      errorText.classList.add('active');
    }

    function hideError() {
      errorText.classList.remove('active');
      errorMessage.textContent = '';
    }

    // Forgot Password Flow
    forgotPasswordLink.addEventListener('click', (e) => {
      e.preventDefault();
      if (typeof UI !== 'undefined' && UI.showConfirm) {
        UI.showConfirm({
          title: 'Reset Password',
          message: 'Please contact the Hostel Administration or Warden Office with your registered College ID to reset your credentials.',
          confirmText: 'Understood',
          cancelText: 'Close'
        });
      } else {
        alert('Please contact the Hostel Administration or Warden Office with your registered College ID to reset your credentials.');
      }
    });

    // Dev Credentials helper
    function fillDevCredentials(roleKey, identifier, password) {
      currentRoleKey = roleKey;
      const roleInfo = ROLES[currentRoleKey];
      roleSubtitleText.textContent = roleInfo.label;
      document.title = roleInfo.label + ' - Smart Hostel Management';
      try {
        localStorage.setItem('hms_selected_role', currentRoleKey);
      } catch (e) {}

      identifierInput.value = identifier;
      passwordInput.value = password;
      hideError();
      updateButtonState();
      identifierInput.focus();
    }

    // Form Submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const identifier = identifierInput.value.trim();
      const password = passwordInput.value;

      if (!identifier || !password) {
        showError('Please enter both username and password');
        return;
      }

      // Handle Remember Me
      try {
        if (rememberMeCheckbox.checked) {
          localStorage.setItem('hms_remember_user', identifier);
        } else {
          localStorage.removeItem('hms_remember_user');
        }
      } catch (e) {}

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            identifier,
            password,
            selectedRole: ROLES[currentRoleKey].code
          })
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.message || 'Invalid username or password');
          submitBtn.disabled = false;
          btnText.style.display = 'inline-block';
          btnSpinner.style.display = 'none';
          return;
        }

        // Login success: always reset previous navigation state before redirect
        Auth.clearNavigationState();
        if (data.mustChangePassword) {
          window.location.replace('/change-password.html');
        } else {
          Auth.redirectToDashboard(data.role);
        }
      } catch (err) {
        showError('Unable to connect to the server. Please try again.');
        submitBtn.disabled = false;
        btnText.style.display = 'inline-block';
        btnSpinner.style.display = 'none';
      }
    });

    // On Load Initialization
    document.addEventListener('DOMContentLoaded', () => {
      initRoleState();

      // Remember Me pre-fill
      try {
        const savedUser = localStorage.getItem('hms_remember_user');
        if (savedUser) {
          identifierInput.value = savedUser;
          rememberMeCheckbox.checked = true;
        }
      } catch (e) {}

      updateButtonState();

      // Show Dev credentials only in local/development environment
      const isDev = window.location.hostname === 'localhost' || 
                    window.location.hostname === '127.0.0.1' ||
                    window.location.port !== '';
      const devBox = document.getElementById('devCredentialsBox');
      if (devBox && isDev) {
        devBox.style.display = 'block';
      }

      // Auto redirect if already logged in
      (async () => {
        try {
          const me = await Auth.getMe();
          if (me) {
            if (me.mustChangePassword) {
              window.location.replace('/change-password.html');
            } else {
              Auth.redirectToDashboard(me.role);
            }
          }
        } catch (e) {}
      })();
    });
  </script>
</body>
</html>
