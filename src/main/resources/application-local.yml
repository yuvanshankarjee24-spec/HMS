spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:h2:mem:${DB_NAME:hostel_db};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: org.h2.Driver
    username: ${LOCAL_DB_USER:sa}
    password: ${LOCAL_DB_PASSWORD:}
    hikari:
      pool-name: HostelSharedHikariPool
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: ${DB_TIMEZONE:UTC}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  admin:
    seed:
      username: ${ADMIN_USERNAME:1234567890}
      password: ${ADMIN_PASSWORD:1234567890}
  security:
    force-password-change-on-first-login: ${FORCE_PASSWORD_CHANGE_ON_FIRST_LOGIN:true}
  room-seed:
    hostel-code: PSG_ITECH
    hostel-name: "PSG iTech Hostel"
    hostel-address: "PSG iTech Campus, Neelambur, Coimbatore"
    start-room-number: 101
    end-room-number: 200
    capacity-per-room: 4
    rooms-per-floor: 25
    total-bed-capacity: 400
    bed-labels:
      - A
      - B
      - C
      - D
  jwt:
    secret: ${JWT_SECRET:devFallbackJwtSecretMustBeChangedInProductionEnvironment2026!}
    expiration-ms: 86400000
    cookie-name: hostel_jwt
  upload:
    dir: ${UPLOAD_DIR:./storage/photos}
  timezone: ${APP_DISPLAY_TIMEZONE:Asia/Kolkata}
  db-timezone: ${DB_TIMEZONE:UTC}
