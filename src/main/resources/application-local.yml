spring:
  datasource:
    url: jdbc:h2:mem:hostel_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: smartHostelManagementSecretKeyForSigningJwtsMustBeLongEnoughAtLeast256Bits2026!
    expiration-ms: 86400000
    cookie-name: hostel_jwt
  upload:
    dir: ./storage/photos
  timezone: Asia/Kolkata
